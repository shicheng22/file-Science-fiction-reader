<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<title>档案终端</title>
<style>
:root{
  --accent:#38f2ff;--accent-dim:rgba(56,242,255,.38);--line:rgba(56,242,255,.16);
  --text:#cfe9f2;--dim:#5f8496;--bg:#060a10;--danger:#ff6b81;
  --ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,.84,.44,1);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body.light-mode{
  --bg:#e9eef3;--text:#1a2a33;--dim:#5a6b75;--line:rgba(0,0,0,.1);
  --accent-dim:rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  height:100vh;height:100dvh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;display:flex;flex-direction:column;overflow:hidden;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(56,242,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,242,255,.05) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(130% 85% at 50% 0%,#000 15%,transparent 78%);
  mask-image:radial-gradient(130% 85% at 50% 0%,#000 15%,transparent 78%);
}
body.light-mode .bg-grid{opacity:.25}
.topbar{position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(6,10,16,.65);backdrop-filter:blur(16px);
  transition:background .3s;
}
body.light-mode .topbar{background:rgba(255,255,255,.65)}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  background-size:220% 100%;animation:sweep 6s linear infinite;pointer-events:none;opacity:.5}
@keyframes sweep{0%{background-position:220% 0}100%{background-position:-220% 0}}
.hamburger{background:none;border:1px solid var(--line);color:var(--accent);
  font-size:18px;line-height:1;padding:6px 10px;border-radius:2px;transition:transform .14s}
.hamburger:active{transform:scale(.92)}
.brand{flex:1;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:13px;letter-spacing:.16em;
  color:var(--accent);white-space:nowrap;overflow:hidden}
.brand .dot{width:6px;height:6px;border-radius:1px;background:var(--accent);
  box-shadow:0 0 10px var(--accent);flex:0 0 auto}
.status-ind{display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  padding:3px 8px;border-radius:2px;border:1px solid currentColor;
  flex:0 0 auto;cursor:pointer;transition:transform .15s;
  animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;box-shadow:0 0 4px currentColor}50%{opacity:1;box-shadow:0 0 12px currentColor}}
.status-ind:active{transform:scale(.94)}
.status-ind.online{color:#7cff9b;background:rgba(124,255,155,.1)}
.status-ind.offline{color:#ff6b81;background:rgba(255,107,129,.1)}
.status-ind.standby{color:#ffd166;background:rgba(255,209,102,.1)}
.status-ind::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.stability-ind{display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  padding:3px 8px;border-radius:2px;border:1px solid var(--dim);
  color:var(--dim);flex:0 0 auto;transition:.2s}
.stability-ind.warn{color:#ffd166;border-color:#ffd166;background:rgba(255,209,102,.08)}
.stability-ind.critical{color:var(--danger);border-color:var(--danger);background:rgba(255,107,129,.1);
  animation:pulse-crit 1s ease-in-out infinite}
@keyframes pulse-crit{0%,100%{opacity:1}50%{opacity:.5}}
.role-indicator{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;
  flex:0 0 auto;cursor:pointer;padding:4px 6px;border-radius:2px;transition:background .15s}
.role-indicator:active{background:rgba(56,242,255,.1)}
.role-indicator b{color:var(--accent);font-weight:600}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:290px;z-index:50;
  background:rgba(7,18,27,.92);border-right:1px solid var(--accent-dim);
  backdrop-filter:blur(20px);transform:translate3d(-100%,0,0);
  transition:transform .28s cubic-bezier(.16,.84,.44,1);
  display:flex;flex-direction:column}
body.light-mode .sidebar{background:rgba(255,255,255,.92)}
.sidebar.show{transform:translate3d(0,0,0)}
.sidebar-mask{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .22s}
.sidebar-mask.show{opacity:1;pointer-events:auto}
.sidebar-head{padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
  font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--accent);
  border-bottom:1px solid var(--line)}
.sidebar-nav{padding:10px 0;flex:1 1 auto;overflow-y:auto}
.sidebar-nav button{display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:13px 18px;text-align:left;
  background:none;border:0;color:var(--text);font-family:var(--mono);
  font-size:13px;letter-spacing:.08em;border-left:2px solid transparent;transition:.16s}
.sidebar-nav button:active,.sidebar-nav button.on{
  background:rgba(56,242,255,.08);border-left-color:var(--accent);color:var(--accent)}
.mail-badge{font-family:var(--mono);font-size:10px;background:var(--danger);color:#fff;
  padding:1px 6px;border-radius:8px;min-width:16px;text-align:center;line-height:1.4}
.mail-badge:empty{display:none}
.sidebar-footer{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);
  border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;
  color:var(--dim);letter-spacing:.1em;line-height:1.7}
.sidebar-footer button{display:block;width:100%;margin-top:8px;padding:10px;
  background:rgba(56,242,255,.06);border:1px solid var(--line);
  color:var(--dim);font-family:var(--mono);font-size:11px;
  border-radius:2px;letter-spacing:.08em;text-align:center}
.sidebar-footer button:active{background:rgba(56,242,255,.15);color:var(--accent)}
main{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
main::-webkit-scrollbar{display:none}
.view{display:none}
.view.active{display:block;animation:viewIn .22s cubic-bezier(.16,.84,.44,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:14px}
.ph-title{font-family:var(--mono);font-size:13px;letter-spacing:.26em;color:var(--accent)}
.ph-sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:5px}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);padding:8px 0;letter-spacing:.05em;line-height:1.6}
.empty{padding:48px 20px;text-align:center;font-family:var(--mono);font-size:12px;
  line-height:2;color:var(--dim);letter-spacing:.08em}
.empty .big{display:block;font-size:32px;margin-bottom:12px;color:rgba(56,242,255,.22)}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:11px 12px 11px 34px;background:rgba(12,24,34,.65);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:2px;
  color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
body.light-mode .search input{background:rgba(255,255,255,.7)}
.search input:focus{border-color:var(--accent-dim);box-shadow:0 0 16px rgba(56,242,255,.1)}
.search::before{content:'';position:absolute;left:12px;top:50%;width:11px;height:11px;
  margin-top:-7px;border:1.5px solid var(--dim);border-radius:50%;pointer-events:none}
.search::after{content:'';position:absolute;left:21px;top:50%;margin-top:3px;
  width:5px;height:1.5px;background:var(--dim);transform:rotate(45deg);pointer-events:none}
.icon-btn{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:11px 12px;border-radius:2px;background:rgba(12,24,34,.65);
  backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--dim);
  transition:.16s;white-space:nowrap}
body.light-mode .icon-btn{background:rgba(255,255,255,.7)}
.icon-btn.on{color:var(--accent);border-color:var(--accent-dim);background:rgba(56,242,255,.1)}
.icon-btn:active{transform:scale(.94)}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:1px 0 4px;margin-bottom:12px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-tag{flex:0 0 auto;font-family:var(--mono);font-size:11px;padding:5px 11px;
  border-radius:2px;border:1px solid var(--line);background:none;color:var(--dim);
  white-space:nowrap;transition:.14s;display:inline-flex;align-items:center;gap:5px}
.filter-tag.on{color:var(--c,var(--accent));border-color:var(--c,var(--accent));background:rgba(56,242,255,.06)}
.filter-tag .x{opacity:.6;font-size:13px}
.rec-swipe{position:relative;overflow:hidden;margin-bottom:10px;border-radius:2px}
.rec-swipe .rec-actions{position:absolute;top:0;right:0;bottom:0;width:140px;
  display:flex;z-index:0;opacity:0;transition:opacity .2s;pointer-events:none}
.rec-swipe.swiping .rec-actions,.rec-swipe.open .rec-actions{opacity:1;pointer-events:auto}
.ra-btn{flex:1;border:0;font-family:var(--mono);font-size:12px;
  background:rgba(56,242,255,.16);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;letter-spacing:.1em}
.ra-btn.danger{background:rgba(255,107,129,.16);color:var(--danger)}
.rec-card{position:relative;z-index:1;padding:12px 14px;
  background:rgba(14,28,40,.75);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-left:2px solid var(--rc,var(--accent-dim));
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  transition:background .16s;user-select:none}
body.light-mode .rec-card{background:rgba(255,255,255,.7)}
.rec-card:active{background:rgba(56,242,255,.1)}
.rec-card.locked{border-left-color:rgba(255,107,129,.55)}
.rec-card.damaged{opacity:.55;border-left-color:var(--danger);filter:grayscale(.6)}
.rec-card.child{opacity:.88}
.rec-card.child .card-title::before{content:'↳ ';color:var(--dim);font-size:12px}
.rec-card .card-title{color:var(--rc,var(--text))}
.card-top{display:flex;align-items:center;gap:6px}
.card-code{font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  color:var(--dim);background:rgba(56,242,255,.06);padding:1px 4px;border-radius:2px;
  flex:0 0 auto;border:1px solid var(--line)}
.card-title{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-time{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto}
.card-author{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}
.card-preview{margin-top:7px;font-size:12px;line-height:1.55;color:var(--dim);
  font-family:var(--mono);white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-preview.lock{color:rgba(255,107,129,.85)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mini-tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  padding:2px 7px;color:var(--dim);border:1px solid rgba(95,132,150,.32);border-radius:2px}
.grade-badge{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:700;
  line-height:1;letter-spacing:.06em;padding:4px 7px;color:var(--c);border:1px solid var(--c)}
.batch-sel{flex:0 0 auto;width:18px;height:18px;border:1px solid var(--dim);border-radius:2px;
  display:grid;place-items:center;font-size:12px;color:#04161c;transition:.14s}
.batch-sel.on{background:var(--accent);border-color:var(--accent)}
.batch-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;
  display:flex;gap:6px;overflow-x:auto;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(6,14,20,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--accent-dim);box-shadow:0 -6px 24px rgba(0,0,0,.4);
  transform:translate3d(0,110%,0);transition:transform .28s cubic-bezier(.16,.84,.44,1);
  scrollbar-width:none}
.batch-bar::-webkit-scrollbar{display:none}
.batch-bar.show{transform:translate3d(0,0,0)}
.bb-btn{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  padding:9px 12px;border-radius:2px;background:rgba(56,242,255,.08);
  border:1px solid var(--accent-dim);color:var(--accent)}
.bb-btn.danger{color:var(--danger);border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.1)}
.overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:rgba(4,8,12,.96);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .22s}
body.light-mode .overlay{background:rgba(240,244,247,.96)}
.overlay.show{opacity:1;pointer-events:auto}
#editor,#viewer,#batchImport,#keyAccess,#devPanel{transform:translate3d(0,100%,0);
  transition:transform .3s cubic-bezier(.16,.84,.44,1),opacity .2s}
#editor.show,#viewer.show,#batchImport.show,#keyAccess.show,#devPanel.show{transform:translate3d(0,0,0)}
#modal{z-index:40;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,10,.9)}
#filterPanel{z-index:32;background:rgba(4,8,12,.96);
  transform:translate3d(0,100%,0);transition:transform .3s cubic-bezier(.16,.84,.44,1);
  height:65%;border-top-left-radius:8px;border-top-right-radius:8px}
#filterPanel.show{transform:translate3d(0,0,0)}
#imageLightbox{z-index:80;align-items:center;justify-content:center;background:rgba(0,0,0,.92)}
#warningModal{z-index:70;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#homePage{z-index:200;align-items:center;justify-content:center;background:rgba(4,8,12,.98)}
.home-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px}
.home-logo{font-family:var(--mono);font-size:30px;letter-spacing:.3em;color:var(--accent);
  text-shadow:0 0 30px var(--accent);white-space:nowrap}
.home-sub{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:24px}
.home-btn{width:220px;padding:14px;background:rgba(56,242,255,.08);
  border:1px solid var(--accent-dim);color:var(--accent);
  font-family:var(--mono);font-size:13px;letter-spacing:.2em;border-radius:2px;
  transition:.18s;cursor:pointer}
.home-btn:active{background:rgba(56,242,255,.25);transform:scale(.97)}
.ed-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);background:rgba(6,10,16,.65);
  backdrop-filter:blur(12px)}
body.light-mode .ed-top{background:rgba(255,255,255,.65)}
.ed-status{flex:1;text-align:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.18em;color:var(--dim)}
.ed-btn{background:none;border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:7px 12px;border-radius:2px;transition:.14s}
.ed-btn:active{opacity:.6;transform:scale(.94)}
.ed-btn.primary{color:var(--accent);border-color:var(--accent-dim);background:rgba(56,242,255,.09)}
.ed-btn.danger{color:var(--danger);border-color:rgba(255,107,129,.4)}
.ed-body,.viewer-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.viewer-body{padding:16px 16px calc(50px + env(safe-area-inset-bottom))}
.ed-body::-webkit-scrollbar,.viewer-body::-webkit-scrollbar{display:none}
.ed-title{width:100%;padding:10px 0;background:transparent;border:0;
  border-bottom:1px solid var(--line);color:#eafaff;font-size:19px;font-weight:600;outline:none}
body.light-mode .ed-title{color:#1a2a33}
.ed-title::placeholder{color:rgba(95,132,150,.6)}
.ed-label{display:flex;align-items:center;gap:10px;margin:16px 0 8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.ed-label::after{content:'';flex:1;height:1px;background:var(--line)}
.ed-content{width:100%;min-height:200px;padding:12px;background:rgba(8,16,24,.65);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:2px;
  color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.7;
  outline:none;resize:vertical}
body.light-mode .ed-content{background:rgba(255,255,255,.65)}
.ed-content:focus{border-color:var(--accent-dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:1px 0 4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;font-size:12px;font-family:var(--mono);
  color:var(--dim);background:rgba(12,24,34,.65);border:1px solid var(--line);
  border-radius:2px;white-space:nowrap;transition:.14s}
body.light-mode .chip{background:rgba(255,255,255,.65)}
.chip.on{color:#04161c;background:var(--accent);border-color:var(--accent);font-weight:600}
.chip.grade{color:var(--c);border-color:var(--c)}
.chip.grade.on{color:#05121a;background:var(--c);border-color:var(--c)}
.btn{flex:1;min-width:80px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:10px 14px;border-radius:2px;background:rgba(56,242,255,.08);
  border:1px solid var(--accent-dim);color:var(--accent);transition:.14s;text-align:center}
.btn:active{opacity:.65;transform:scale(.96)}
.btn.danger{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.38);color:var(--danger)}
.btn.ghost{color:var(--dim);border-color:var(--line);background:none}
.finput{width:100%;padding:10px 12px;background:rgba(8,16,24,.65);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:2px;
  color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
body.light-mode .finput{background:rgba(255,255,255,.65)}
.finput:focus{border-color:var(--accent-dim)}
.finput::placeholder{color:rgba(95,132,150,.6)}
textarea.finput{font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical;min-height:60px}
.viewer-title{font-size:22px;font-weight:600;color:var(--rc,var(--text));margin-bottom:10px;line-height:1.3}
.viewer-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;
  font-family:var(--mono);font-size:11px;color:var(--dim)}
.viewer-meta span{padding:2px 7px;border:1px solid var(--line);border-radius:2px}
.viewer-section{padding:12px 0;border-top:1px solid var(--line)}
.viewer-section-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);margin-bottom:10px}
.viewer-content{font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--text);
  white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.viewer-content .copyable{-webkit-user-select:text;user-select:text;font-weight:700;color:#fff;
  background:rgba(56,242,255,.06);padding:0 1px;border-radius:1px}
body.light-mode .viewer-content .copyable{color:#0a7f8c}
.chapter-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chapter-tabs::-webkit-scrollbar{display:none}
.chapter-tab{flex:0 0 auto;padding:6px 12px;font-family:var(--mono);font-size:11px;
  color:var(--dim);border:1px solid var(--line);border-radius:2px;background:none}
.chapter-tab:active{background:rgba(56,242,255,.08);color:var(--accent)}
.attach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.attach-card{background:rgba(8,16,24,.65);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:2px;padding:8px;cursor:pointer}

function fmtFull(t){
  if(!t) return '—';
  if(typeof t === 'string') return t;
  const d = new Date(t);
  if(isNaN(d.getTime())) return String(t);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function readFileText(f){
  return new Promise((res,rej)=>{
    if(f.text){ f.text().then(res).catch(rej); return; }
    const r = new FileReader();
    r.onload = ()=>res(String(r.result));
    r.onerror = rej;
    r.readAsText(f);
  });
}
function readFileDataUrl(f){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(String(r.result));
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
function safeName(s){
  return String(s||'档案').replace(/[\\/:*?"<>|]/g,'_').slice(0,60) || '档案';
}
function downloadBlob(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    return true;
  }catch(e){ return false; }
}
function downloadText(filename, text, mime){
  return downloadBlob(filename, new Blob([text], {type: mime || 'text/plain;charset=utf-8'}));
}
function compressImage(file, maxW, quality){
  maxW = maxW || 800; quality = quality || 0.65;
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      try{
        URL.revokeObjectURL(url);
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        res(canvas.toDataURL('image/jpeg', quality));
      }catch(err){ rej(err); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function randomGarble(keyword){
  const chars = '!@#$%^&*()_+-=[]{}|;:,.?/~`ABCDEF0123456789';
  const len = 25 + Math.floor(Math.random()*30);
  let s = '';
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  if(keyword && Math.random() > 0.4){
    const pos = Math.floor(Math.random()*s.length);
    return s.slice(0,pos) + keyword + s.slice(pos);
  }
  return s;
}

/* =========================================================
   音效
   ========================================================= */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  return audioCtx;
}
function playSound(type){
  if(!DB.settings || !DB.settings.soundOn) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    switch(type){
      case 'click':
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
        break;
      case 'success':
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
        break;
      case 'error':
        osc.type = 'square'; osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
        break;
      case 'notify':
        osc.type = 'sine'; osc.frequency.setValueAtTime(660, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
        setTimeout(()=>{
          try{
            const osc2 = ctx.createOscillator(); const g2 = ctx.createGain();
            osc2.connect(g2); g2.connect(ctx.destination);
            osc2.type='sine'; osc2.frequency.setValueAtTime(990, ctx.currentTime);
            g2.gain.setValueAtTime(0.05, ctx.currentTime);
            g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc2.start(ctx.currentTime); osc2.stop(ctx.currentTime + 0.3);
          }catch(e){}
        }, 150);
        break;
      case 'type':
        osc.type = 'square'; osc.frequency.setValueAtTime(800 + Math.random()*400, now);
        gain.gain.setValueAtTime(0.008, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.start(now); osc.stop(now + 0.03);
        break;
    }
  }catch(e){}
}

function migrateDB(d){
  const out = blankDB();
  if(!d || typeof d !== 'object') return out;

  const libsIn = Array.isArray(d.libraries) && d.libraries.length ? d.libraries : null;
  if(libsIn){
    out.libraries = libsIn.map(lib=>({
      id: lib.id || uid(),
      name: String(lib.name || '档案库'),
      key: String(lib.key || ''),
      isDefault: !!lib.isDefault,
      grades: Array.isArray(lib.grades) && lib.grades.length ? lib.grades.map(migrateGrade) : cloneDefaultGrades(),
      tags: Array.isArray(lib.tags) ? lib.tags.map(t=>({id:t.id||uid(), name:String(t.name||'标签'), color:t.color||'#38f2ff'})) : [],
      categories: Array.isArray(lib.categories) ? lib.categories.map(c=>({id:c.id||uid(), name:String(c.name||'分类'), color:c.color||'#38f2ff'})) : [],
      records: Array.isArray(lib.records) ? lib.records.map(migrateRecord) : []
    }));
    if(!out.libraries.some(l=>l.isDefault)) out.libraries[0].isDefault = true;
  } else {
    const lib = blankLibrary('主档案库', true);
    lib.grades = Array.isArray(d.grades) && d.grades.length ? d.grades.map(migrateGrade) : cloneDefaultGrades();
    lib.tags = Array.isArray(d.tags) ? d.tags.map(t=>({id:t.id||uid(), name:String(t.name||'标签'), color:t.color||'#38f2ff'})) : [];
    lib.categories = Array.isArray(d.categories) ? d.categories.map(c=>({id:c.id||uid(), name:String(c.name||'分类'), color:c.color||'#38f2ff'})) : [];
    lib.records = Array.isArray(d.records) ? d.records.map(migrateRecord) : [];
    out.libraries = [lib];
  }

  if(d.roleKeys && typeof d.roleKeys === 'object'){
    ROLE_ORDER.forEach(k=>{
      const v = d.roleKeys[k];
      if(v != null && /^\d{2,12}$/.test(String(v))) out.roleKeys[k] = String(v);
    });
  }
  if(Array.isArray(d.customRoles)){
    out.customRoles = d.customRoles.filter(r=>r && r.id && r.name && r.prefix).map(r=>({
      id: String(r.id),
      name: String(r.name),
      prefix: ROLE_PREFIXES.some(p=>p.prefix===r.prefix) ? r.prefix : 'user_',
      suffix: /^\d{2,12}$/.test(String(r.suffix||'')) ? String(r.suffix) : '0000',
      level: typeof r.level === 'number' ? r.level : 1
    }));
    out.customRoles.forEach(r=>{ out.roleKeys[r.id] = r.suffix; });
  }
  out.currentRole = (ROLE_DEFS[d.currentRole] || out.customRoles.some(r=>r.id===d.currentRole)) ? d.currentRole : 'guest';
  out.currentLibraryId = d.currentLibraryId && out.libraries.some(l=>l.id===d.currentLibraryId)
    ? d.currentLibraryId : out.libraries[0].id;
  out.status = ['online','offline','standby'].includes(d.status) ? d.status : 'online';
  out.stability = typeof d.stability === 'number' ? Math.max(0, Math.min(100, d.stability)) : (85 + Math.floor(Math.random()*16));
  out.globalTriggers = Array.isArray(d.globalTriggers) ? d.globalTriggers.map(migrateTrigger) : [];
  out.backupRecords = Array.isArray(d.backupRecords) ? d.backupRecords.map(migrateRecord) : [];
  out.unlockedRecords = Array.isArray(d.unlockedRecords) ? d.unlockedRecords.filter(x=>typeof x==='string') : [];
  out.globalTermOut = String(d.globalTermOut || '');
  out.keyHistory = Array.isArray(d.keyHistory) ? d.keyHistory.filter(x=>x && x.recordId).map(x=>({
    recordId: String(x.recordId),
    libId: String(x.libId || ''),
    time: typeof x.time === 'number' ? x.time : Date.now()
  })) : [];
  out.mails = Array.isArray(d.mails) ? d.mails.filter(m=>m && m.id).map(m=>({
    id: String(m.id),
    title: String(m.title || ''),
    body: String(m.body || ''),
    author: String(m.author || ''),
    time: typeof m.time === 'number' ? m.time : Date.now(),
    read: !!m.read,
    replies: Array.isArray(m.replies) ? m.replies.map(r=>({
      text: String(r.text || ''),
      time: typeof r.time === 'number' ? r.time : Date.now()
    })) : [],
    autoReplies: Array.isArray(m.autoReplies) ? m.autoReplies.filter(r=>r && typeof r === 'object').map(r=>({
      expect: String(r.expect || ''),
      text: String(r.text || ''),
      delay: Math.max(0, parseInt(r.delay,10) || 0),
      due: typeof r.due === 'number' ? r.due : 0
    })) : [],
    pendingReply: m.pendingReply && typeof m.pendingReply === 'object' ? {
      text: String(m.pendingReply.text || ''),
      due: typeof m.pendingReply.due === 'number' ? m.pendingReply.due : Date.now()
    } : null
  })) : [];
  out.emailAddress = String(d.emailAddress || 'terminal@archive.local');
  out.stabilityRecovery = d.stabilityRecovery && typeof d.stabilityRecovery === 'object' ? {
    active: !!d.stabilityRecovery.active,
    target: typeof d.stabilityRecovery.target === 'number' ? d.stabilityRecovery.target : 80
  } : null;
  out.profile = d.profile && typeof d.profile === 'object' ? {
    name: String(d.profile.name || '')
  } : { name: '' };
  const s = (d.settings && typeof d.settings === 'object') ? d.settings : {};
  out.settings = {
    accent: typeof s.accent === 'string' ? s.accent : '#38f2ff',
    mode: s.mode === 'light' ? 'light' : 'dark',
    terminalLoadDelay: typeof s.terminalLoadDelay === 'number' ? s.terminalLoadDelay : 800,
    searchLoadDelay: typeof s.searchLoadDelay === 'number' ? s.searchLoadDelay : 200,
    soundOn: s.soundOn !== false
  };
  const ds = (d.devSettings && typeof d.devSettings === 'object') ? d.devSettings : {};
  out.devSettings = {
    defaultRole: (ROLE_DEFS[ds.defaultRole] || out.customRoles.some(r=>r.id===ds.defaultRole)) ? ds.defaultRole : 'guest',
    defaultStatus: ['online','offline','standby'].includes(ds.defaultStatus) ? ds.defaultStatus : 'online'
  };
  return out;
}
function migrateGrade(g){
  const builtin = DEFAULT_GRADES.find(x=>x.id===g.id);
  if(builtin){
    return {
      ...builtin,
      name: g.name || builtin.name,
      color: g.color || builtin.color,

  };
}
function migrateRecord(r){

  })) : [];
  rec.recordKey = String(r.recordKey || '');
  rec.readDelay = typeof r.readDelay === 'number' ? Math.max(0, Math.min(10, r.readDelay)) : 1;
  rec.copyableRanges = Array.isArray(r.copyableRanges) ? r.copyableRanges.filter(x=>x && typeof x.start === 'number' && typeof x.end === 'number' && x.end > x.start) : [];
  rec.chapters = Array.isArray(r.chapters) ? r.chapters.map(c=>({
    id: c.id || uid(),
    title: String(c.title || '章节'),
    targetRecordId: String(c.targetRecordId || ''),
    order: typeof c.order === 'number' ? c.order : 0
  })) : [];
  rec.triggers = Array.isArray(r.triggers) ? r.triggers.map(migrateTrigger) : [];
  rec.themeColor = String(r.themeColor || '');
  rec.notes = String(r.notes || '');
  rec.damaged = !!r.damaged;

}

function loadDB(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    if(!raw){
      for(const k of LEGACY_KEYS){
        raw = localStorage.getItem(k);
        if(raw) break;
      }
    }
  }catch(e){}
  if(!raw) return blankDB();
  try{ return migrateDB(JSON.parse(raw)); }
  catch(e){ console.warn(e); return blankDB(); }
}

function applyTheme(){
  const s = DB.settings || { accent:'#38f2ff', mode:'dark' };
  document.documentElement.style.setProperty('--accent', s.accent);
  document.documentElement.style.setProperty('--accent-dim', hexToRgba(s.accent, .38));
  document.documentElement.style.setProperty('--line', hexToRgba(s.accent, .16));
  document.body.classList.toggle('light-mode', s.mode === 'light');
}
function hexToRgba(hex, a){
  const h = String(hex||'#38f2ff').replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function curLib(){ return DB.libraries.find(l=>l.id === DB.currentLibraryId) || DB.libraries[0]; }
function getGrade(id){ return curLib().grades.find(g=>g.id === id); }
function getCategory(id){ return curLib().categories.find(c=>c.id === id); }
function getTag(id){ return curLib().tags.find(t=>t.id === id); }

function allRoles(){
  const list = ROLE_ORDER.map(k=>({key:k, ...ROLE_DEFS[k]}));
  (DB.customRoles||[]).forEach(r=>{
    list.push({
      key: r.id,
      name: r.name,
      level: r.level,
      prefix: r.prefix,
      defaultSuffix: r.suffix,
      builtin: false,
      isAdmin: false
    });
  });
  return list;
}
function getRole(key){ return allRoles().find(r=>r.key === key); }
function roleName(){ const r = getRole(DB.currentRole); return r ? r.name : '游客'; }
function isAdmin(){ const r = getRole(DB.currentRole); return !!(r && r.isAdmin); }

function canViewGrade(g){
  if(!g) return true;
  if(isAdmin()) return true;
  if(!g.allowedRoles || !g.allowedRoles.length) return true;
  return g.allowedRoles.indexOf(DB.currentRole) >= 0;
}
function canViewRecord(r){
  if(r.damaged) return false;
  if(isAdmin()) return true;
  const g = getGrade(r.gradeId);
  if(canViewGrade(g)) return true;
  return false;
}
function tryMatchRoleKey(input){
  const s = String(input||'').trim();
  if(!s) return null;
  for(const role of allRoles()){
    const suffix = DB.roleKeys[role.key] || role.defaultSuffix;
    if(s === role.prefix + suffix) return role.key;
    if(role.key === 'c' && s === 'user_cidm_' + suffix) return role.key;
    if(role.key === 'b' && s === 'user_bidm_' + suffix) return role.key;
    if(role.key === 'a' && s === 'yip_aidm_' + suffix) return role.key;
    if(role.key === 's' && s === 'yip_sidm_' + suffix) return role.key;
  }
  return null;
}

function getChildMotherSets(){
  const childIds = new Set();
  const motherIds = new Set();
  curLib().records.forEach(r=>{
    if(r.chapters && r.chapters.length){
      motherIds.add(r.id);
      r.chapters.forEach(ch=>{ if(ch.targetRecordId) childIds.add(ch.targetRecordId); });
    }
  });
  return {childIds, motherIds};
}

function recYear(r){
  const t = (r.createdAtText || '').trim();
  if(t){
    const m = t.match(/^(\d{4})/);
    if(m) return m[1];
    return '未知';
  }
  return '未知';
}

function filteredRecords(){
  let list = curLib().records.slice();
  const {childIds, motherIds} = getChildMotherSets();

  if(state.filterTagId) list = list.filter(r=>(r.tagIds||[]).includes(state.filterTagId));
  if(state.filterCatId) list = list.filter(r=>r.categoryId === state.filterCatId);
  if(state.filterGradeId) list = list.filter(r=>r.gradeId === state.filterGradeId);
  if(state.filterYear) list = list.filter(r=>recYear(r) === String(state.filterYear));
  if(state.filterChapter === 'related') list = list.filter(r=>childIds.has(r.id) || motherIds.has(r.id));
  else if(state.filterChapter === 'mother') list = list.filter(r=>motherIds.has(r.id));
  else if(state.filterChapter === 'child') list = list.filter(r=>childIds.has(r.id));

  list = list.filter(canViewRecord);

  if(state.q){
    const q = state.q.toLowerCase();
    list = list.filter(r =>
      (r.title||'').toLowerCase().includes(q) ||
      (r.code||'').toLowerCase().includes(q) ||
      (r.content||'').toLowerCase().includes(q) ||
      (r.author||'').toLowerCase().includes(q) ||
      (r.description||'').toLowerCase().includes(q)
    );
  }
  list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return list;
}

function showProgress(durationMs){
  if(progressRunning) return Promise.resolve(false);
  progressRunning = true;
  return new Promise(resolve=>{
    show('#progressOverlay');
    const fill = $('#poFill');
    const pctEl = $('#poPct');
    fill.style.width = '0%';
    pctEl.textContent = '0%';
    const start = Date.now();
    let done = false;
    let localTimer = null;
    const finish = (ok)=>{
      if(done) return;
      done = true;
      progressRunning = false;
      if(localTimer) clearInterval(localTimer);
      hide('#progressOverlay');
      resolve(ok);
    };
    const cancelBtn = $('#poCancel');
    if(cancelBtn) cancelBtn.onclick = ()=>finish(false);
    localTimer = setInterval(()=>{
      const elapsed = Date.now() - start;
      const pct = Math.min(100, Math.round((elapsed / durationMs) * 100));
      fill.style.width = pct + '%';
      pctEl.textContent = pct + '%';
      if(pct >= 100){ setTimeout(()=>finish(true), 100); }
    }, 30);
  });
}

async function openRecord(r, bypass){
  if(DB.status === 'standby'){ toast('系统待机中，无法阅读'); playSound('error'); return; }
  if(r.damaged){ toast('该档案已损坏，无法读取'); playSound('error'); return; }
  if(!bypass && !canViewRecord(r)){ toast('权限不足，请使用密钥访问'); playSound('error'); return; }
  if(r.readDelay > 0){
    const ok = await showProgress(r.readDelay * 1000);
    if(!ok) return;
  }
  currentRecord = r;
  renderViewer();
  show('#viewer');
  playSound('success');
  setTimeout(()=>typeWriterInViewer(), 80);
}

function typeWriterInViewer(){
  if(!currentRecord) return;
  const body = $('#viewerBody');
  if(!body) return;
  const contentEl = body.querySelector('.viewer-content.typing');
  if(!contentEl) return;
  const fullHTML = contentEl.getAttribute('data-html') || '';
  if(!fullHTML) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = fullHTML;
  const fullText = tmp.textContent || '';
  if(!fullText){ contentEl.classList.remove('typing'); contentEl.innerHTML = fullHTML; return; }
  contentEl.textContent = '';
  contentEl.style.minHeight = '60px';
  let i = 0;
  const speed = 18;
  let lastSound = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(()=>{
    if(i >= fullText.length){
      clearInterval(typingTimer);
      contentEl.innerHTML = fullHTML;
      contentEl.classList.remove('typing');
      return;
    }
    contentEl.textContent = fullText.slice(0, i+1) + '▌';
    i += 1;
    const now = Date.now();
    if(now - lastSound > 60){ playSound('type'); lastSound = now; }
  }, speed);
}

function jumpToRecord(recordId){
  const target = curLib().records.find(r=>r.id === recordId);
  if(!target){ toast('目标档案不存在'); return; }
  if(target.damaged){ toast('目标档案已损坏'); return; }
  if(canViewRecord(target)){
    hide('#viewer');
    currentRecord = null;
    setTimeout(()=>openRecord(target, true), 220);
    return;
  }
  if(!target.recordKey){ toast('该档案无密钥可解锁'); return; }
  openForm({
    title:'⚠ 需要档案密钥',
    fields:[{key:'key', label:'输入目标档案的密钥', type:'password', maxlength:80}],
    okText:'验证',
    onSubmit(v){
      if(v.key === target.recordKey){
        if(!DB.unlockedRecords.includes(target.id)){
          DB.unlockedRecords.push(target.id);
          saveDB();
        }
        hide('#viewer');
        currentRecord = null;
        setTimeout(()=>openRecord(target, true), 220);
        return true;
      }
      toast('密钥错误');
      playSound('error');
      return false;
    }
  });
}

function renderGarbleLines(keyword, count){

  for(let i=0;i<n;i++){

async function handleTerminalInput(type, record){
  const inputEl = type === 'record' ? $('#viewerTermInput') : $('#globalTermInput');
  if(!inputEl) return;
  const raw = inputEl.value.trim();
  if(!raw) return;
  inputEl.value = '';

  if(DB.status === 'offline'){
    toast('未连接到终端');
    playSound('error');
    return;
  }
  if(raw === '自动恢复'){
    if(!DB.stabilityRecovery) DB.stabilityRecovery = { active: true, target: 80 };
    else DB.stabilityRecovery.active = true;
    saveDB();
    const ctxId = type === 'record' ? 'rec_'+record.id : 'global';
    appendTerm(ctxId, `> 稳定率自动恢复已启动`);
    refreshTerm(ctxId);
    playSound('success');
    return;
  }

  const ctxId = type === 'record' ? 'rec_'+record.id : 'global';

  for(let i=0;i<4;i++){
    appendTerm(ctxId, `<div class="garble">${randomGarble(raw)}</div>`);
    refreshTerm(ctxId);
    playSound('type');
    await new Promise(r=>setTimeout(r, 120));
  }
  appendTerm(ctxId, `> 执行: ${esc(raw)}`);
  refreshTerm(ctxId);
  await new Promise(r=>setTimeout(r, 100));

  const triggers = type === 'record' ? (record.triggers||[]) : (DB.globalTriggers||[]);
  let matched = 0;
  for(const t of triggers){
    if(!t.enabled) continue;
    if(!t.permanent && t.used) continue;
    if(t.trigger !== raw) continue;
    matched++;
    executeTrigger(t, type, record);
    refreshTerm(ctxId);
    await new Promise(r=>setTimeout(r, 150));
  }

  if(!matched) appendTerm(ctxId, `<span class="err">> 未知指令：${esc(raw)}</span>`);
  refreshTerm(ctxId);
}

function colorOrEmpty(v){
  return (v && /^#[0-9a-fA-F]{3,8}$/.test(v)) ? v : '';
}

function executeTrigger(t, type, record){
  const ctxId = type === 'record' ? 'rec_'+record.id : 'global';
  try{
    switch(t.action){
      case 'print':{
        const c = colorOrEmpty(t.p2);
        appendTerm(ctxId, c ? `<span style="color:${c}">> ${esc(t.p1)}</span>` : `> ${esc(t.p1)}`);
        break;
      }
      case 'dialog':{
        const rules = parseDialogRules(t.p4);
        const listed = String(t.p3||'').split('\n').map(s=>s.trim()).filter(Boolean);
        const options = listed.length ? listed : rules.map(r=>r.key);
        const dialogBody = `<div style="white-space:pre-wrap;color:var(--text);margin-bottom:12px">${esc(t.p2||'')}</div>`
          + (options.length ? `<div id="dlgOptions" style="display:flex;flex-direction:column;gap:8px">${options.map((opt,i)=>`<button class="btn" data-dlg-opt="${i}" style="text-align:left;justify-content:flex-start">${esc(opt)}</button>`).join('')}</div>` : '')
          + `<div style="display:flex;gap:8px;margin-top:12px">
               <input id="dlgInput" class="finput" placeholder="输入回复内容…" autocomplete="off" style="flex:1">
               <button class="btn" id="dlgSend">发送</button>
             </div>
             <div id="dlgEcho" style="margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--dim)"></div>`;
        modalCfg = { title: t.p1 || '对话', fields: [], okText:'关闭', onSubmit: ()=>true };
        $('#modalTitle').textContent = t.p1 || '对话';
        $('#modalOk').textContent = '关闭';
        $('#modalFields').innerHTML = dialogBody;
        show('#modal');
        const submitReply = raw=>{
          const text = String(raw||'').trim();
          if(!text) return;
          const echo = $('#dlgEcho');
          if(!echo) return;
          echo.innerHTML += `<div style="color:var(--accent);margin-bottom:6px">> 你：${esc(text)}</div>`;
          const rule = rules.find(r=>r.key === text);
          let reply = '';
          if(rule) reply = rule.value;
          else if(!rules.length) reply = autoDialogResponse(text);
          if(reply){
            setTimeout(()=>{
              const box = $('#dlgEcho');
              if(!box) return;
              box.innerHTML += `<div style="color:var(--text);margin-bottom:6px">> ${esc(reply)}</div>`;
              playSound('notify');
            }, 300);
          }
          playSound('click');
        };
        setTimeout(()=>{
          $$('#dlgOptions [data-dlg-opt]').forEach(btn=>{
            btn.onclick = ()=>submitReply(options[parseInt(btn.dataset.dlgOpt, 10)]);
          });
          const input = $('#dlgInput');
          const send = $('#dlgSend');
          if(input){
            input.addEventListener('keydown', e=>{
              if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); submitReply(input.value); input.value = ''; }
            });
          }
          if(send) send.onclick = ()=>{ submitReply(input ? input.value : ''); if(input) input.value = ''; };
        }, 50);
        appendTerm(ctxId, `> 对话已开启：${esc(t.p1||'')}`);
        break;
      }
      case 'reveal':{
        const c = colorOrEmpty(t.p2) || 'var(--accent)';
        appendTerm(ctxId, `<span style="color:${c}">> 隐藏文本（可复制）：</span><span class="reveal" contenteditable="true" spellcheck="false">${esc(t.p1)}</span>`);
        break;
      }
      case 'add-tag':
        if(t.p1){ curLib().tags.push({id:uid(), name:t.p1, color: colorOrEmpty(t.p2) || '#38f2ff'}); saveDB(); render(); appendTerm(ctxId, `> 已添加标签：${esc(t.p1)}`); }
        break;
      case 'add-category':
        if(t.p1){ curLib().categories.push({id:uid(), name:t.p1, color: colorOrEmpty(t.p2) || '#38f2ff'}); saveDB(); render(); appendTerm(ctxId, `> 已添加分类：${esc(t.p1)}`); }
        break;
      case 'add-grade':
        if(t.p1){ curLib().grades.push({id:uid(), name:t.p1, color: colorOrEmpty(t.p2) || '#38f2ff', builtin:false, allowedRoles:[]}); saveDB(); render(); appendTerm(ctxId, `> 已添加分级：${esc(t.p1)}`); }
        break;
      case 'add-backup':{
        const backup = DB.backupRecords.find(b=>b.id === t.p1);
        if(backup){
          const copy = JSON.parse(JSON.stringify(backup));
          copy.id = uid();
          copy.createdAt = Date.now();
          copy.updatedAt = Date.now();
          curLib().records.unshift(copy);
          saveDB(); render();
          appendTerm(ctxId, `> 已实例化备用档案：${esc(backup.title)}`);
        }
        break;
      }
      case 'add-image':
        if(type === 'record' && record && t.p1){
          record.attachments = record.attachments || [];
          record.attachments.push({id:uid(), dataUrl:t.p1, caption:t.p2||'', damaged:false});
          record.updatedAt = Date.now();
          saveDB();
          appendTerm(ctxId, `> 已添加图片附录`);
          renderViewer();
        }
        break;
      case 'delete-image':
        if(type === 'record' && record){
          const idx = (record.attachments||[]).findIndex(a=>a.id === t.p1);
          if(idx >= 0){
            record.attachments.splice(idx, 1);
            record.updatedAt = Date.now();
            saveDB();
            appendTerm(ctxId, `> 已删除图片`);
            renderViewer();
          } else appendTerm(ctxId, `<span class="err">> 图片不存在</span>`);
        }
        break;
      case 'modify-image':
        if(type === 'record' && record){
          const idx = (record.attachments||[]).findIndex(a=>a.id === t.p1);
          if(idx >= 0){
            record.attachments[idx].caption = t.p2||'';
            record.updatedAt = Date.now();
            saveDB();
            appendTerm(ctxId, `> 已修改图片注释`);
            renderViewer();
          }
        }
        break;
      case 'damage-image':{
        if(t.p1){
          const parts = String(t.p1).split('::');
          const target = curLib().records.find(r=>r.id === parts[0]);
          if(target && target.attachments){
            const img = target.attachments.find(a=>a.id === parts[1]);
            if(img){
              img.damaged = true;
              target.updatedAt = Date.now();
              saveDB(); render();
              appendTerm(ctxId, `> 图片已损坏`);
            }
          }
        }
        break;
      }
      case 'repair-image':{
        if(t.p1){
          const parts = String(t.p1).split('::');
          const target = curLib().records.find(r=>r.id === parts[0]);
          if(target && target.attachments){
            const img = target.attachments.find(a=>a.id === parts[1]);
            if(img){
              img.damaged = false;
              target.updatedAt = Date.now();
              saveDB(); render();
              appendTerm(ctxId, `> 图片已修复`);
            }
          }
        }
        break;
      }
      case 'delete-record':
        if(type === 'record' && record){
          curLib().records = curLib().records.filter(r=>r.id!==record.id);
          saveDB();
          appendTerm(ctxId, `> 当前档案已删除`);
          hide('#viewer');
          currentRecord = null;
          render();
        }
        break;
      case 'damage-record':{
        const target = curLib().records.find(r=>r.id === t.p1);
        if(target){
          target.damaged = true;
          target.updatedAt = Date.now();
          saveDB(); render();
          appendTerm(ctxId, `> 档案「${esc(target.title)}」已损坏`);
        }
        break;
      }
      case 'set-status':
        if(['online','offline','standby'].includes(t.p1)){
          DB.status = t.p1;
          saveDB(); renderTop();
          appendTerm(ctxId, `> 状态切换为：${t.p1}`);
          if(t.p1 === 'standby' && currentRecord){
            toast('系统待机，自动退出档案');
            hide('#viewer');
            currentRecord = null;
          }
        }
        break;
      case 'set-stability':{
        const val = parseInt(t.p1,10) || 0;
        const op = t.p2 || 'set';
        if(op === 'set') stabilityLive = Math.max(0, Math.min(100, val));
        else if(op === 'add') stabilityLive = Math.max(0, Math.min(100, stabilityLive + val));
        else if(op === 'sub') stabilityLive = Math.max(0, Math.min(100, stabilityLive - val));
        DB.stability = stabilityLive;
        saveDB(); renderTop();
        appendTerm(ctxId, `> 稳定率：${Math.round(stabilityLive)}%`);
        break;
      }
      case 'replace-content':
        if(type === 'record' && record){
          record.content = t.p1 || '';
          record.updatedAt = Date.now();
          saveDB();
          appendTerm(ctxId, `> 正文已替换`);
          renderViewer();
        }
        break;
      case 'append-content':
        if(type === 'record' && record){
          record.content = (record.content||'') + '\n' + (t.p1||'');
          record.updatedAt = Date.now();
          saveDB();
          appendTerm(ctxId, `> 正文已追加`);
          renderViewer();
        }
        break;
      case 'modify-role':{
        const role = getRole(t.p1);
        if(role && /^\d{2,12}$/.test(t.p2||'')){
          DB.roleKeys[t.p1] = t.p2;
          const cr = DB.customRoles.find(r=>r.id===t.p1);
          if(cr) cr.suffix = t.p2;
          saveDB();
          appendTerm(ctxId, `> 已修改 ${esc(role.name)} 密钥后缀为 ${esc(t.p2)}`);
        } else appendTerm(ctxId, `<span class="err">> 权限或后缀无效</span>`);
        break;
      }
      case 'switch-role':{
        const role = getRole(t.p1);
        if(role){
          DB.currentRole = role.key;
          saveDB(); renderTop(); render();
          appendTerm(ctxId, `> 已切换到：${esc(role.name)}`);
        }
        break;
      }
      case 'jump-record':
        if(t.p1){
          appendTerm(ctxId, `> 正在跳转…`);
          setTimeout(()=>jumpToRecord(t.p1), 300);
        }
        break;
      case 'modify-record-key':{
        const target = curLib().records.find(r=>r.id === t.p1);
        if(target){ target.recordKey = t.p2||''; target.updatedAt = Date.now(); saveDB(); appendTerm(ctxId, `> 已修改「${esc(target.title)}」密钥`); }
        break;
      }
      case 'modify-record-title':{
        const target = curLib().records.find(r=>r.id === t.p1);
        if(target){ target.title = t.p2||'未命名'; target.updatedAt = Date.now(); saveDB(); render(); appendTerm(ctxId, `> 已修改标题`); }
        break;
      }
      case 'add-trigger':{
        if(t.p1){
          const pool = type === 'record' && record ? record.triggers : (DB.globalTriggers || []);
          if(Array.isArray(pool)){
            const newT = {id:uid(), trigger: t.p2 || 'new', action: t.p1, p1:'', p2:'', p3:'', p4:'', p5:'', p6:'', p7:'', p8:'', permanent:true, used:false, enabled:true};
            pool.push(newT);
            saveDB();
            appendTerm(ctxId, `> 已添加触发器：${esc(newT.trigger)}`);
            if(type === 'record') renderViewer();
          }
        }
        break;
      }
      case 'delete-trigger':{
        if(t.p1){
          if(type === 'record' && record){
            record.triggers = record.triggers.filter(x=>x.trigger !== t.p1);
            renderViewer();
          } else {
            DB.globalTriggers = (DB.globalTriggers||[]).filter(x=>x.trigger !== t.p1);
          }
          saveDB();
          appendTerm(ctxId, `> 已删除触发器：${esc(t.p1)}`);
        }
        break;
      }
      case 'popup-image':{
        if(t.p1){
          $('#lbImg').src = t.p1;
          $('#lbCap').textContent = t.p2 || '';
          lightboxRecordRef = null;
          lightboxIndex = -1;
          show('#imageLightbox');
          appendTerm(ctxId, `> 已弹出图片`);
        }
        break;
      }
      case 'warning':{
        const bg = colorOrEmpty(t.p3) || '#ff6b81';
        const fg = colorOrEmpty(t.p4) || '#ffffff';
        $('#warnBox').style.setProperty('--wc', bg);
        $('#warnBox').style.setProperty('--wt', fg);
        $('#warnTitle').textContent = t.p1 || '警告';
        $('#warnMsg').textContent = t.p2 || '';
        show('#warningModal');
        playSound('error');
        appendTerm(ctxId, `> 警告弹窗已显示：${esc(t.p1||'')}`);
        break;
      }
      case 'garble':{
        appendTerm(ctxId, renderGarbleLines(t.p1 || '指令', t.p2 || 6));
        break;
      }
      case 'add-library':{
        if(t.p1){
          const lib = blankLibrary(t.p1, false);
          lib.key = t.p2 || '';
          DB.libraries.push(lib);
          saveDB(); render();
          appendTerm(ctxId, `> 已新建档案库：${esc(t.p1)}`);
        }
        break;
      }
      case 'migrate-record':{
        const src = curLib().records.find(r=>r.id === t.p1);
        const target = DB.libraries.find(l=>l.id === t.p2);
        if(src && target){
          curLib().records = curLib().records.filter(r=>r.id !== src.id);
          target.records.push(src);
          saveDB(); render();
          appendTerm(ctxId, `> 已迁移「${esc(src.title)}」到「${esc(target.name)}」`);
        } else {
          appendTerm(ctxId, `<span class="err">> 档案或档案库不存在</span>`);
        }
        break;
      }
      case 'delete-library':{
        const lib = DB.libraries.find(l=>l.id === t.p1);
        if(lib){
          if(lib.isDefault){ appendTerm(ctxId, `<span class="err">> 默认档案库不可删除</span>`); break; }
          DB.libraries = DB.libraries.filter(l=>l.id !== lib.id);
          if(DB.currentLibraryId === lib.id) DB.currentLibraryId = DB.libraries[0].id;
          saveDB(); render();
          appendTerm(ctxId, `> 已删除档案库：${esc(lib.name)}`);
        }
        break;
      }
      case 'popup-file':{
        if(t.p1){
          const name = t.p2 || '文件';
          const mime = t.p3 || '';
          if(mime.startsWith('image/')){
            $('#lbImg').src = t.p1;
            $('#lbCap').textContent = name;
            lightboxRecordRef = null;
            lightboxIndex = -1;
            show('#imageLightbox');
            appendTerm(ctxId, `> 已弹出图片文件：${esc(name)}`);
          } else if(mime.startsWith('text/') || mime === 'application/json' || mime === ''){
            let text = '';
            try{
              if(t.p1.startsWith('data:')){
                const base64 = t.p1.split(',')[1] || '';
                text = decodeURIComponent(escape(atob(base64)));
              } else {
                text = t.p1;
              }
            }catch(e){ text = '（无法解析文本）'; }
            const body = `<div class="file-preview-box">${esc(text)}</div>
              <div class="set-actions" style="margin-top:10px">
                <button class="btn" id="pfDownload">下载文件</button>
              </div>`;
            modalCfg = { title:'文件预览：' + name, fields:[], okText:'关闭', onSubmit: ()=>true };
            $('#modalTitle').textContent = '文件预览：' + name;
            $('#modalOk').textContent = '关闭';
            $('#modalFields').innerHTML = body;
            show('#modal');
            setTimeout(()=>{
              const btn = $('#pfDownload');
              if(btn) btn.onclick = ()=>{
                const a = document.createElement('a');
                a.href = t.p1;
                a.download = name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                toast('已下载');
              };
            }, 30);
            appendTerm(ctxId, `> 已弹出文件：${esc(name)}`);
          } else {
            const a = document.createElement('a');
            a.href = t.p1;
            a.download = name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            appendTerm(ctxId, `> 已下载文件：${esc(name)}`);
          }
        }
        break;
      }
      case 'send-mail':{
        const title = t.p1 || '无标题';
        const body = t.p2 || '';
        const author = t.p3 || '系统';
        const delay = Math.max(0, parseInt(t.p4,10) || 0);
        const expect = String(t.p5||'').trim();
        const replyText = t.p6 || '';
        const replyDelay = Math.max(0, parseInt(t.p7,10) || 0);
        const sendNow = ()=>{
          const mail = {
            id: uid(),
            title,
            body,
            author,
            time: Date.now(),
            read: false,
            replies: [],
            autoReplies: expect ? [{ expect, text: replyText, delay: replyDelay, due: 0 }] : [],
            pendingReply: null
          };
          DB.mails.unshift(mail);
          saveDBNow();
          renderTop();
          sendSystemNotification('新邮件', title);
          playSound('notify');
        };
        if(delay > 0) setTimeout(sendNow, delay * 1000);
        else sendNow();
        appendTerm(ctxId, `> 邮件已发送：${esc(title)}`);
        break;
      }
      case 'reply-mail':{
        const mail = DB.mails.find(m=>m.id === t.p1);
        if(mail){
          const expect = String(t.p2||'').trim();
          if(!expect){
            appendTerm(ctxId, `<span class="err">> 未设置触发回复内容</span>`);
            break;
          }
          if(!Array.isArray(mail.autoReplies)) mail.autoReplies = [];
          mail.autoReplies.push({
            expect,
            text: t.p3 || '',
            delay: Math.max(0, parseInt(t.p4,10) || 0),
            due: 0
          });
          saveDBNow();
          appendTerm(ctxId, `> 已设置邮件「${esc(mail.title)}」的触发回复`);
        } else {
          appendTerm(ctxId, `<span class="err">> 目标邮件不存在</span>`);
        }
        break;
      }
      case 'set-mail':{
        if(t.p1){
          DB.emailAddress = t.p1;
          saveDB();
          appendTerm(ctxId, `> 邮箱地址已设置为：${esc(t.p1)}`);
        }
        break;
      }
    }
    if(!t.permanent){ t.used = true; saveDB(); }
  }catch(e){
    console.warn(e);
    appendTerm(ctxId, `<span class="err">> 异常：${esc(String(e.message||e))}</span>`);
  }
}

function parseDialogRules(raw){
  const rules = [];
  String(raw||'').split('\n').forEach(line=>{
    const s = line.trim();
    if(!s) return;
    const m = s.match(/^(.*?)\s*(?:=>|->|→)\s*(.*)$/);
    if(!m) return;
    const key = m[1].trim();
    if(!key) return;
    rules.push({ key, value: m[2].trim() });
  });
  return rules;
}

function autoDialogResponse(input){
  const s = String(input||'');
  if(/打开\s*(\d+)/.test(s)){
    const n = s.match(/打开\s*(\d+)/)[1];
    return `已打开 ${n} 号档案。`;
  }
  if(/查看\s*(\d+)/.test(s)){
    const n = s.match(/查看\s*(\d+)/)[1];
    return `已定位 ${n} 号档案。`;
  }
  if(/关闭|退出/.test(s)) return '已关闭当前会话。';
  if(/帮助|help/i.test(s)) return '可用指令：打开N / 查看N / 关闭 / 帮助。';
  if(/你好|hi|hello/i.test(s)) return '你好，有什么可以帮你的？';
  return '收到。';
}

function maybeScheduleMailAutoReply(mail, userText){
  if(!mail || !Array.isArray(mail.autoReplies) || !mail.autoReplies.length) return false;
  const text = String(userText||'').trim();
  if(!text) return false;
  const idx = mail.autoReplies.findIndex(rule=>{
    if(!rule || rule.due) return false;
    const expects = String(rule.expect||'').split(/[\n|]/).map(s=>s.trim()).filter(Boolean);
    return expects.includes(text);
  });
  if(idx < 0) return false;
  const rule = mail.autoReplies.splice(idx, 1)[0];
  const delay = Math.max(0, parseInt(rule.delay,10) || 0);
  if(delay > 0){
    mail.autoReplies.push({ expect: rule.expect, text: rule.text, delay, due: Date.now() + delay * 1000 });
  } else {
    mail.replies.push({ text: rule.text || '', time: Date.now() });
    mail.read = false;
    sendSystemNotification('邮件回复已送达', mail.title);
    playSound('notify');
  }
  return true;
}

function renderMailDetail(el){
  const m = DB.mails.find(x=>x.id === state.currentMailId);
  if(!m){ state.currentMailId = null; return renderMailbox(); }
  if(!m.read){ m.read = true; saveDB(); renderTop(); }
  let repliesHTML = '';
  if(m.replies.length){
    repliesHTML = `<div class="viewer-section">
      <div class="viewer-section-title">回复记录（${m.replies.length}）</div>
      ${m.replies.map(r=>`<div class="email-reply">${esc(r.text)}\n<span style="color:var(--dim);font-size:10px">${fmtFull(r.time)}</span></div>`).join('')}
    </div>`;
  }
  let pendingHTML = '';
  if(m.pendingReply && m.pendingReply.due > Date.now()){
    pendingHTML = `<div class="hint" style="color:var(--accent)">⏳ 已设置延迟回复，预计 ${fmtFull(m.pendingReply.due)} 发出</div>`;
  }
  el.innerHTML = `
    <div class="ed-top" style="border-bottom:1px solid var(--line);background:transparent;padding:10px 0">
      <button class="ed-btn" id="mailBack">返回</button>
      <span class="ed-status">邮件详情</span>
      <button class="ed-btn danger" id="mailDel">删除</button>
    </div>
    <div class="email-detail">
      <div class="ed-row"><div class="ed-k">主题</div><div class="ed-v" style="font-size:16px;font-weight:600">${esc(m.title)}</div></div>
      <div class="ed-row"><div class="ed-k">发件人</div><div class="ed-v">${esc(m.author)}</div></div>
      <div class="ed-row"><div class="ed-k">时间</div><div class="ed-v">${fmtFull(m.time)}</div></div>
      <div class="ed-row"><div class="ed-k">正文</div><div class="ed-v">${esc(m.body)}</div></div>
    </div>
    ${repliesHTML}
    ${pendingHTML}
    <div class="viewer-section">
      <div class="viewer-section-title">回复</div>
      <textarea id="mailReplyText" class="finput" placeholder="输入回复内容…" style="min-height:100px"></textarea>
      <div class="ed-label" style="margin-top:12px">延迟发送（秒，0 为立即）</div>
      <input id="mailReplyDelay" class="finput" type="number" value="0" min="0" max="86400">
      <div class="set-actions" style="margin-top:12px">
        <button class="btn primary" id="mailReplySend">发送回复</button>
      </div>
    </div>
  `;
  $('#mailBack').onclick = ()=>{ state.currentMailId = null; render(); };
  $('#mailDel').onclick = ()=>{
    if(!confirm('删除这封邮件？')) return;
    DB.mails = DB.mails.filter(x=>x.id !== m.id);
    state.currentMailId = null;
    saveDBNow(); render(); toast('已删除');
  };
  $('#mailReplySend').onclick = ()=>{
    const text = $('#mailReplyText').value.trim();
    if(!text){ toast('请输入回复内容'); return; }
    const delay = Math.max(0, parseInt($('#mailReplyDelay').value,10) || 0);
    if(delay > 0){
      m.pendingReply = { text, due: Date.now() + delay * 1000 };
      saveDBNow();
      toast('已设置延迟回复');
    } else {
      m.replies.push({ text, time: Date.now() });
      m.read = true;
      maybeScheduleMailAutoReply(m, text);
      saveDBNow();
      toast('已回复');
    }
    playSound('success');
    render();
  };
}

      ${isAdmin()?`<button class="mini-btn danger" id="kaHistoryClear">重置记录</button>`:''}
    </div>
    <div id="kaHistory"></div>
  `;
  renderKeyHistory();
  const clearBtn = $('#kaHistoryClear');
  if(clearBtn) clearBtn.onclick = resetKeyHistory;
  $('#kaTermSend').onclick = doKeyAccess;
  $('#kaTermInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); doKeyAccess(); }
  });
}

function renderKeyHistory(){
  const box = $('#kaHistory');
  if(!box) return;
  const admin = isAdmin();
  const history = (DB.keyHistory||[]).slice(-10).reverse();
  if(!history.length){
    box.innerHTML = `<div class="hint">暂无访问记录</div>`;
    return;
  }
  const items = [];
  history.forEach(h=>{
    const lib = DB.libraries.find(l=>l.id === h.libId) || curLib();
    const r = lib.records.find(x=>x.id === h.recordId);
    if(!r) return;
    if(r.damaged) return;
    items.push(`<div class="key-history-item" data-kh-record="${esc(r.id)}" data-kh-lib="${esc(lib.id)}">
      <span class="kh-name">${esc(r.title)}</span>
      <span class="kh-time">${fmtFull(h.time)}</span>
      ${admin?`<button class="mini-btn danger" data-kh-del="${esc(h.recordId)}" data-kh-del-lib="${esc(h.libId)}">删</button>`:''}
    </div>`);
  });
  box.innerHTML = items.length ? items.join('') : `<div class="hint">历史记录中的档案已被删除或损坏</div>`;
  box.querySelectorAll('[data-kh-del]').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      if(!isAdmin()){ toast('权限不足：仅管理员可删除访问记录'); return; }
      if(!confirm('删除该条访问记录？')) return;
      DB.keyHistory = (DB.keyHistory||[]).filter(x=>!(x.recordId === btn.dataset.khDel && x.libId === btn.dataset.khDelLib));
      saveDB(); renderKeyHistory(); toast('访问记录已删除');
    };
  });
}

function resetKeyHistory(){
  if(!isAdmin()){ toast('权限不足：仅管理员可重置访问记录'); return; }
  if(!confirm('重置最近访问记录？此操作不可恢复')) return;
  DB.keyHistory = [];
  saveDB(); renderKeyHistory(); toast('访问记录已重置');
}

function kaAppend(html){
  const out = $('#kaTermOut');
  if(!out) return;
  out.innerHTML += '\n' + html;
  out.scrollTop = out.scrollHeight;
}

async function doKeyAccess(){
  const input = $('#kaTermInput');
  const key = (input.value || '').trim();
  if(!key){ toast('请输入档案密钥'); return; }
  input.value = '';

  kaAppend(`> 开始解析：${esc(key)}`);

  const steps = ['校验密钥长度', '匹配档案索引', '解密元数据', '定位档案库', '读取权限'];
  for(let i=0;i<steps.length;i++){
    await new Promise(res=>setTimeout(res, 120 + Math.random()*180));
    kaAppend(`<div class="garble">${randomGarble(steps[i])}</div>`);
    playSound('type');
  }
  await new Promise(res=>setTimeout(res, 200));

  const libs = isAdmin() ? DB.libraries : [curLib()];
  let found = null;
  for(const lib of libs){
    const r = lib.records.find(x=>x.recordKey === key);
    if(r){ found = {lib, record:r}; break; }
  }

  if(!found){
    kaAppend(`<span class="err">> 密钥无效，未找到匹配档案</span>`);
    $('#kaResult').innerHTML = '';
    playSound('error');
    return;
  }

  if(found.record.damaged){
    kaAppend(`<span class="err">> 该档案已损坏，无法访问</span>`);
    $('#kaResult').innerHTML = '';
    playSound('error');
    return;
  }

  kaAppend(`> 密钥有效，已定位档案`);

  if(!DB.keyHistory) DB.keyHistory = [];
  DB.keyHistory = DB.keyHistory.filter(h=>!(h.recordId === found.record.id && h.libId === found.lib.id));
  DB.keyHistory.push({ recordId: found.record.id, libId: found.lib.id, time: Date.now() });
  if(DB.keyHistory.length > 30) DB.keyHistory = DB.keyHistory.slice(-30);
  saveDB();
  renderKeyHistory();

  const r = found.record;
  const g = getGrade(r.gradeId);
  const c = getCategory(r.categoryId);
  $('#kaResult').innerHTML = `
    <div class="ed-label">解析结果 · 预览</div>
    <div class="rec-card" data-ka-open="${esc(r.id)}" data-ka-lib="${esc(found.lib.id)}" style="cursor:pointer;--rc:${g?esc(g.color):'var(--accent-dim)'}">
      <div class="card-top">
        ${g?`<span class="grade-badge" style="--c:${esc(g.color)}">${esc(g.name)}</span>`:''}
        <span class="card-title">${esc(r.title)}</span>
        ${r.code?`<span class="card-code">${esc(r.code)}</span>`:''}
        <span class="card-time">${esc(r.createdAtText || fmtFull(r.createdAt))}</span>
      </div>
      ${r.author||r.organization?`<div class="card-author">${esc(r.author||'—')}${r.organization?' / '+esc(r.organization):''}</div>`:''}
      <div class="card-preview">${esc((r.description || r.content || '').replace(/<[^>]+>/g,'').slice(0,140) || '（空白档案）')}</div>
      <div class="card-meta">
        <span class="mini-tag" style="color:var(--accent);border-color:var(--accent-dim)">档案库：${esc(found.lib.name)}</span>
        ${c?`<span class="mini-tag" style="color:${esc(c.color||'#38f2ff')};border-color:${esc(c.color||'#38f2ff')}">${esc(c.name)}</span>`:''}
      </div>
    </div>
    <div class="hint">点击上方卡片进入阅读</div>
  `;
  playSound('success');
}

function renderSetStats(el){
  const lib = curLib();
  const total = lib.records.length;

  if(!isAdmin()){
    const visible = lib.records.filter(canViewRecord).length;
    const percent = total > 0 ? Math.round(visible / total * 100) : 0;
    el.innerHTML = settingsHeader('统计', '当前权限进度') + `
      <div class="set-card">
        <div class="progress-big">
          <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
          <div class="pct">${percent}<small>%</small></div>
          <div class="lbl">可查看的档案占比</div>
        </div>
        <div class="set-row"><span class="k">当前权限</span><span class="v"><b>${esc(roleName())}</b></span></div>
      </div>
    `;
    return;
  }

  const tabs = [
    {key:'overview', name:'总览'},
    {key:'grades', name:'分级'},
    {key:'categories', name:'分类'},
    {key:'tags', name:'标签'}
  ];

  let contentHTML = '';
  if(state.statsTab === 'overview'){
    contentHTML = `<div class="set-card">
      <div class="stat-total">${total}<span>份档案</span></div>
      <div class="hint">档案分布概览，点击上方选项卡查看详情</div>
    </div>`;
  } else {
    const items = state.statsTab === 'grades' ? lib.grades
      : state.statsTab === 'categories' ? lib.categories
      : lib.tags;
    const getter = state.statsTab === 'grades' ? (r=>r.gradeId)
      : state.statsTab === 'categories' ? (r=>r.categoryId)
      : (r=>r.tagIds);
    const counts = items.map(it=>{
      const n = lib.records.filter(r=>{
        const v = getter(r);
        return Array.isArray(v) ? v.indexOf(it.id)>=0 : v === it.id;
      }).length;
      return {name: it.name, color: it.color || '#38f2ff', n};
    }).sort((a,b)=>b.n-a.n);

    contentHTML = counts.map(c=>{
      const pct = total > 0 ? Math.round(c.n / total * 100) : 0;
      return `<div class="stat-card">
        <div class="sc-head">
          <span class="sc-name" style="color:${esc(c.color)}">${esc(c.name)}</span>
          <span class="sc-num">${c.n}</span>
        </div>
        <div class="sc-bar"><div class="sc-fill" style="width:${pct}%;--c:${esc(c.color)}"></div></div>
        <div class="sc-pct">${pct}%</div>
      </div>`;
    }).join('') || `<div class="hint">暂无数据</div>`;
  }

  el.innerHTML = settingsHeader('统计', '档案分布总览') + `
    <div class="stat-tabs">
      ${tabs.map(t=>`<button class="stat-tab ${state.statsTab===t.key?'on':''}" data-stattab="${t.key}">${t.name}</button>`).join('')}
    </div>
    ${contentHTML}
  `;
}

function delCustomRole(roleKey){
  if(!isAdmin()){ toast('权限不足'); return; }
  const role = DB.customRoles.find(r=>r.id === roleKey);
  if(!role) return;
  if(!confirm('删除自定义权限「' + role.name + '」？')) return;
  DB.customRoles = DB.customRoles.filter(r=>r.id !== roleKey);
  delete DB.roleKeys[roleKey];
  DB.libraries.forEach(lib=>{
    lib.grades.forEach(g=>{
      if(g.allowedRoles) g.allowedRoles = g.allowedRoles.filter(x=>x !== roleKey);
    });
  });
  if(DB.currentRole === roleKey) DB.currentRole = 'guest';
  saveDB(); render(); toast('已删除');
}

function getDraft(){
  try{ const raw = localStorage.getItem(DRAFT); if(!raw) return null; return JSON.parse(raw); }
  catch(e){ return null; }
}
function saveDraftNow(){
  if(!editingRecord || editingRecord.id || editingRecord._isBackup) return;
  try{
    const data = {
      title: $('#edTitle')?.value || '',
      code: $('#edCode')?.value || '',
      description: $('#edDescription')?.value || '',
      summary: $('#edSummary')?.value || '',
      content: $('#edContent')?.innerHTML || '',
      author: $('#edAuthor')?.value || '',
      organization: $('#edOrganization')?.value || '',
      createdAt: editingRecord.createdAt,
      createdAtText: $('#edCreatedText')?.value || '',
      gradeId: editingRecord.gradeId,
      categoryId: editingRecord.categoryId,
      tagIds: editingRecord.tagIds,
      attachments: editingRecord.attachments,
      chapters: editingRecord.chapters,
      triggers: editingRecord.triggers,
      recordKey: editingRecord.recordKey,
      readDelay: editingRecord.readDelay,
      copyableRanges: editingRecord.copyableRanges,
      themeColor: editingRecord.themeColor
    };
    if(!data.title.trim() && !data.content.trim()){
      localStorage.removeItem(DRAFT);
      return;
    }
    const doSave = ()=>{
      try{ localStorage.setItem(DRAFT, JSON.stringify(data)); }catch(e){}
    };
    if(window.requestIdleCallback){
      window.requestIdleCallback(doSave, { timeout: 3000 });
    } else {
      setTimeout(doSave, 0);
    }
  }catch(e){}
}
function scheduleDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 1500);
}

function openEditor(record, opts){
  opts = opts || {};
  const isBackup = !!opts.isBackup;
  if(!isAdmin()){ toast('权限不足：仅管理员可编辑'); return; }
  if(record){
    editingRecord = JSON.parse(JSON.stringify(record));
  } else {
    const d = getDraft();
    if(d && (d.title || d.content)){
      editingRecord = {
        id: null, title:d.title||'', code:d.code||'', description:d.description||'', summary:d.summary||'',
        content:d.content||'', author:d.author||'', organization:d.organization||'',
        createdAt:d.createdAt||Date.now(), createdAtText:d.createdAtText||'',
        gradeId:d.gradeId||'', categoryId:d.categoryId||'',
        tagIds:d.tagIds||[], attachments:d.attachments||[], chapters:d.chapters||[],
        triggers:d.triggers||[], recordKey:d.recordKey||'', readDelay:d.readDelay||1,
        copyableRanges:d.copyableRanges||[], themeColor:d.themeColor||'',
        type: opts.type || 'text'
      };
      toast('已恢复上次草稿');
    } else {
      editingRecord = blankRecord();
      if(opts.type) editingRecord.type = opts.type;
    }
  }
  editingRecord._isBackup = isBackup;
  savedRange = null;
  renderEditor();
  show('#editor');
}
