    <button type="button" class="btn" id="edAddChapter" style="width:100%;margin-top:6px">＋ 添加章节</button>` : ''}
    <div class="ed-label">${isImage?'图片档案':'附录图片'}（${ed.attachments.length}）</div>
    <div id="edAttachList"></div>
    <button type="button" class="btn" id="edAddImg" style="width:100%;margin-top:6px">＋ 添加图片</button>
    <input type="file" id="edImgInput" accept="image/*" multiple hidden>
    <div class="ed-label">事件触发器（${ed.triggers.length}）</div>
    <div id="edTriggers"></div>
    <button type="button" class="btn" id="edAddTrigger" style="width:100%;margin-top:6px">＋ 添加触发器</button>
    <div class="ed-tools" style="margin-top:14px">
      <button type="button" class="btn" id="edExportMain">导出</button>
    </div>
    <div class="ed-tools" style="margin-top:8px">
      <button type="button" class="btn ghost" id="edImportText">导入文本</button>
      ${!isBackup?`<button type="button" class="btn danger" id="edDel">删除</button>`:''}
    </div>
    <input type="file" id="edFileInput" multiple hidden accept=".txt,.md,.markdown,.text,.log,.json,.csv,.html,.js,.css">
  `;

  const bind = (sel, prop) => {
    const el = $(sel);
    if(!el) return;
    el.addEventListener('input', e=>{ editingRecord[prop] = e.target.value; scheduleDraft(); });
  };
  bind('#edTitle', 'title');
  bind('#edCode', 'code');
  bind('#edDescription', 'description');
  bind('#edSummary', 'summary');
  bind('#edAuthor', 'author');
  bind('#edOrganization', 'organization');
  bind('#edCreatedText', 'createdAtText');
  $('#edDelay')?.addEventListener('input', e=>{
    const v = parseFloat(e.target.value);
    editingRecord.readDelay = isNaN(v) ? 1 : Math.max(0, Math.min(10, v));
    scheduleDraft();
  });
  $('#edRecordKey')?.addEventListener('input', e=>{ editingRecord.recordKey = e.target.value; scheduleDraft(); });
  $('#edThemeColor')?.addEventListener('input', e=>{
    editingRecord.themeColor = e.target.value;
    scheduleDraft();
  });
  $('#edThemeClear')?.addEventListener('click', ()=>{
    editingRecord.themeColor = '';
    const inp = $('#edThemeColor');
    if(inp) inp.value = '#38f2ff';
    scheduleDraft();
    toast('已设置跟随分级');
  });

  const edContent = $('#edContent');
  if(edContent){
    edContent.addEventListener('input', e=>{
      editingRecord.content = e.target.innerHTML;
      scheduleDraft();
    });
    edContent.addEventListener('blur', ()=>{
      const sel = window.getSelection();
      if(sel.rangeCount && edContent.contains(sel.anchorNode)){
        savedRange = sel.getRangeAt(0).cloneRange();
      }
    });
  }

  const restoreRange = ()=>{
    if(!edContent) return;
    edContent.focus();
    if(savedRange){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }
  };

  $$('#edToolbar [data-cmd]').forEach(btn=>{
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', ()=>{
      if(!edContent) return;
      restoreRange();
      const cmd = btn.dataset.cmd;
      if(cmd === 'quote'){
        document.execCommand('insertHTML', false, '<span class="quote">▍</span>');
      } else if(cmd === 'dblquote'){
        document.execCommand('insertHTML', false, '<span class="dblquote">▐</span>');
      } else if(cmd === 'note'){
        document.execCommand('insertHTML', false, '<span class="note">（注释）</span>');
      } else if(cmd === 'insertTable'){
        document.execCommand('insertHTML', false, '<table border="1" style="border-collapse:collapse;margin:4px 0"><tr><td>单元格</td><td>单元格</td></tr><tr><td>单元格</td><td>单元格</td></tr></table>');
      } else {
        document.execCommand(cmd, false, null);
      }
      editingRecord.content = edContent.innerHTML;
      scheduleDraft();
    });
  });

  const textColor = $('#edTextColor');
  if(textColor){
    textColor.addEventListener('mousedown', e=>e.preventDefault());
    textColor.addEventListener('change', ()=>{
      if(!edContent) return;
      restoreRange();
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, textColor.value);
      editingRecord.content = edContent.innerHTML;
      scheduleDraft();
    });
  }

  $('#edGrades')?.addEventListener('click', e=>{
    const b = e.target.closest('[data-gid]'); if(!b) return;
    editingRecord.gradeId = editingRecord.gradeId === b.dataset.gid ? '' : b.dataset.gid;
    $$('#edGrades [data-gid]').forEach(x=>x.classList.toggle('on', x.dataset.gid === editingRecord.gradeId));
    scheduleDraft();
  });
  $('#edCats')?.addEventListener('click', e=>{
    const b = e.target.closest('[data-cid]'); if(!b) return;
    editingRecord.categoryId = editingRecord.categoryId === b.dataset.cid ? '' : b.dataset.cid;
    $$('#edCats [data-cid]').forEach(x=>x.classList.toggle('on', x.dataset.cid === editingRecord.categoryId));
    scheduleDraft();
  });
  $('#edTags')?.addEventListener('click', e=>{
    const b = e.target.closest('[data-tid]'); if(!b) return;
    const id = b.dataset.tid;
    const i = editingRecord.tagIds.indexOf(id);
    if(i>=0) editingRecord.tagIds.splice(i,1); else editingRecord.tagIds.push(id);
    b.classList.toggle('on', editingRecord.tagIds.indexOf(id) >= 0);
    scheduleDraft();
  });

  $('#edMarkCopy')?.addEventListener('click', ()=>{
    if(!savedRange){ toast('请先在正文中选中文字'); return; }
    toast('已记录可复制位置');
  });
  $('#edClearCopy')?.addEventListener('click', ()=>{
    if(!confirm('清空可复制标记？')) return;
    editingRecord.copyableRanges = [];
    renderEditor(); scheduleDraft();
  });

  renderChapters();
  renderAttachments();
  renderTriggers();

  $('#edAddImg')?.addEventListener('click', ()=>$('#edImgInput').click());
  $('#edImgInput')?.addEventListener('change', async e=>{
    const files = Array.prototype.slice.call(e.target.files||[]);
    e.target.value = '';
    if(!files.length) return;
    let n = 0;
    for(const f of files){
      try{
        const dataUrl = await compressImage(f, 800, 0.65);
        editingRecord.attachments.push({id:uid(), dataUrl, caption:'', damaged:false});
        n++;
      }catch(err){}
    }
    if(n){ renderEditor(); scheduleDraft(); toast('已添加 '+n+' 张图片'); }
  });

  $('#edAddChapter')?.addEventListener('click', ()=>{
    editingRecord.chapters.push({id:uid(), title:'新章节', targetRecordId:'', order: editingRecord.chapters.length});
    renderEditor(); scheduleDraft();
  });

  $('#edAddTrigger')?.addEventListener('click', ()=>{
    openTriggerForm('record', null, t=>{
      editingRecord.triggers.push(t);
      renderEditor(); scheduleDraft();
    });
  });

  $('#edImportText')?.addEventListener('click', ()=>$('#edFileInput').click());
  $('#edFileInput')?.addEventListener('change', async e=>{
    const files = Array.prototype.slice.call(e.target.files||[]);
    e.target.value = '';
    if(!files.length) return;
    let count = 0;
    for(const f of files){
      let text = '';
      try{ text = await readFileText(f); }catch(err){ continue; }
      const base = f.name.replace(/\.[^.]+$/,'');
      if(!editingRecord.title.trim() && !editingRecord.content.trim() && files.length===1){
        editingRecord.title = base;
        editingRecord.content = '<div>' + esc(text).replace(/\n/g,'<br>') + '</div>';
      } else {
        editingRecord.content = (editingRecord.content || '') + '<div>━━━ ' + esc(f.name) + ' ━━━</div><div>' + esc(text).replace(/\n/g,'<br>') + '</div>';
        if(!editingRecord.title.trim()) editingRecord.title = base;
      }
      count++;
    }
    if(count){ renderEditor(); saveDraftNow(); toast('已导入 '+count+' 个文件'); }
  });

  $('#edExportMain')?.addEventListener('click', ()=>openExportFormatDialog(editingRecord));

  $('#edDel')?.addEventListener('click', ()=>{
    if(!editingRecord.id){ toast('尚未保存'); return; }
    if(!confirm('删除该档案？')) return;
    if(editingRecord._isBackup){
      DB.backupRecords = DB.backupRecords.filter(r=>r.id !== editingRecord.id);
    } else {
      curLib().records = curLib().records.filter(r=>r.id !== editingRecord.id);
    }
    if(saveDBNow()){
      editingRecord = null;
      try{ localStorage.removeItem(DRAFT); }catch(e){}
      hide('#editor'); render(); toast('已删除');
    }
  });
}

function renderChapters(){
  const box = $('#edChapters');
  if(!box || !editingRecord) return;
  if(!editingRecord.chapters.length){
    box.innerHTML = `<div class="hint">暂无章节</div>`;
    return;
  }
  box.innerHTML = editingRecord.chapters.map(ch=>`
    <div class="list-item">
      <span class="li-name">${esc(ch.title)}</span>
      <button type="button" class="mini-btn" data-che="edit" data-id="${ch.id}">编辑</button>
      <button type="button" class="mini-btn danger" data-che="del" data-id="${ch.id}">删除</button>
    </div>
  `).join('');

  box.querySelectorAll('[data-che]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const idx = editingRecord.chapters.findIndex(c=>c.id===id);
      if(idx < 0) return;
      if(btn.dataset.che === 'del'){
        editingRecord.chapters.splice(idx,1);
        renderEditor(); scheduleDraft();
      } else {
        const ch = editingRecord.chapters[idx];
        const recordOptions = curLib().records
          .filter(r=>r.id !== editingRecord.id)
          .map(r=>`<option value="${r.id}" ${ch.targetRecordId===r.id?'selected':''}>${esc(r.title)}</option>`).join('');
        openForm({
          title:'编辑章节（跳转目标）',
          fields:[
            {key:'title', label:'章节标题', value:ch.title, maxlength:30},
            {key:'target', label:'跳转目标档案', type:'select', options:
              '<option value="">— 请选择 —</option>' + recordOptions
            }
          ],
          onSubmit(v){
            ch.title = v.title || '章节';
            ch.targetRecordId = v.target || '';
            renderEditor(); scheduleDraft();
          }
        });
      }
    });
  });
}

function renderAttachments(){
  const box = $('#edAttachList');
  if(!box || !editingRecord) return;
  if(!editingRecord.attachments.length){
    box.innerHTML = `<div class="hint">暂无图片</div>`;
    return;
  }
  box.innerHTML = editingRecord.attachments.map((a,i)=>{
    if(a.damaged){
      return `<div class="attach-item">
        <div style="width:70px;height:70px;background:#000;border-radius:2px;flex:0 0 auto;display:grid;place-items:center;color:var(--danger);font-size:10px">损坏</div>
        <div class="am">
          <div class="hint" style="padding:0">图片已损坏，无法预览</div>
          <button type="button" class="mini-btn" data-repairimg="${i}">修复</button>
          <button type="button" class="mini-btn danger" data-rmimg="${i}">删除</button>
        </div>
      </div>`;
    }
    return `<div class="attach-item">
      <img src="${a.dataUrl}" alt="附录" data-lb-record="" data-lb-index="${i}">
      <div class="am">
        <input class="finput" data-cap="${i}" value="${esc(a.caption||'')}" placeholder="图片注释">
        <button type="button" class="mini-btn danger" data-rmimg="${i}">删除</button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-cap]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.cap,10);
      if(editingRecord.attachments[i]) editingRecord.attachments[i].caption = inp.value;
      scheduleDraft();
    });
  });
  box.querySelectorAll('[data-rmimg]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingRecord.attachments.splice(parseInt(btn.dataset.rmimg,10),1);
      renderEditor(); scheduleDraft();
    });
  });
  box.querySelectorAll('[data-repairimg]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.repairimg,10);
      if(editingRecord.attachments[i]){
        editingRecord.attachments[i].damaged = false;
        renderEditor(); scheduleDraft();
      }
    });
  });
  box.querySelectorAll('img[data-lb-index]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const i = parseInt(img.dataset.lbIndex,10);
      const a = editingRecord.attachments[i];
      if(!a) return;
      $('#lbImg').src = a.dataUrl;
      $('#lbCap').textContent = a.caption || '（无注释）';
      lightboxRecordRef = null;
      lightboxIndex = -1;
      show('#imageLightbox');
    });
  });
}

function renderTriggers(){
  const box = $('#edTriggers');
  if(!box || !editingRecord) return;
  if(!editingRecord.triggers.length){
    box.innerHTML = `<div class="hint">暂无触发器</div>`;
    return;
  }
  box.innerHTML = editingRecord.triggers.map(t=>`
    <div class="list-item">
      <span class="li-name">${esc(t.trigger)} → ${esc(TRIGGER_ACTIONS[t.action]?.name || t.action)}</span>
      <span class="li-sub">${t.permanent?'永久':'一次性'}${(!t.permanent&&t.used)?'·已用':''}</span>
      <button type="button" class="mini-btn" data-tre="edit" data-id="${t.id}">改</button>
      <button type="button" class="mini-btn danger" data-tre="del" data-id="${t.id}">删</button>
    </div>
  `).join('');
  box.querySelectorAll('[data-tre]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const idx = editingRecord.triggers.findIndex(t=>t.id===id);
      if(idx < 0) return;
      if(btn.dataset.tre === 'del'){
        editingRecord.triggers.splice(idx,1);
        renderEditor(); scheduleDraft();
      } else {
        openTriggerForm('record', editingRecord.triggers[idx], t=>{
          editingRecord.triggers[idx] = t;
          renderEditor(); scheduleDraft();
        });
      }
    });
  });
}

function triggerFieldHTML(f, t, scope){
  const val = t[f.key] || f.default || '';
  switch(f.type){
    case 'textarea':
      return `<div class="field"><label>${esc(f.label)}</label>
        <textarea class="finput" data-tf="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea></div>`;
    case 'color':
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="color" class="color-native" data-tf="${f.key}" value="${esc(val||'#38f2ff')}"></div>`;
    case 'select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          ${(f.options||[]).map(o=>{
            const v = typeof o === 'object' ? o.value : o;
            const lbl = typeof o === 'object' ? o.label : o;
            return `<option value="${v}" ${val===v?'selected':''}>${esc(lbl)}</option>`;
          }).join('')}
        </select></div>`;
    case 'number':
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="number" class="finput" data-tf="${f.key}" value="${esc(val||'')}"></div>`;
    case 'bool':
      return `<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" data-tf="${f.key}" ${String(val)==='true'?'checked':''}>
        <span>${esc(f.label)}</span></label></div>`;
    case 'backup-select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择备用档案 —</option>
          ${DB.backupRecords.map(b=>`<option value="${b.id}" ${val===b.id?'selected':''}>${esc(b.title)}</option>`).join('')}
        </select></div>`;
    case 'record-select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择档案 —</option>
          ${curLib().records.map(r=>`<option value="${r.id}" ${val===r.id?'selected':''}>${esc(r.title)}</option>`).join('')}
        </select></div>`;
    case 'role-select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择权限 —</option>
          ${allRoles().map(r=>`<option value="${r.key}" ${val===r.key?'selected':''}>${esc(r.name)}</option>`).join('')}
        </select></div>`;
    case 'library-select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择档案库 —</option>
          ${DB.libraries.map(l=>`<option value="${l.id}" ${val===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}
        </select></div>`;
    case 'mail-select':
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择邮件 —</option>
          ${(DB.mails||[]).map(m=>`<option value="${m.id}" ${val===m.id?'selected':''}>${esc(m.title)} · ${esc(m.author)}</option>`).join('')}
        </select></div>`;
    case 'trigger-action-select':{
      const allowed = scope === 'global' ? GLOBAL_ACTION_KEYS : RECORD_ACTION_KEYS;
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          ${allowed.map(k=>`<option value="${k}" ${val===k?'selected':''}>${esc(TRIGGER_ACTIONS[k].name)}</option>`).join('')}
        </select></div>`;
    }
    case 'trigger-select':{
      const triggers = scope === 'record'
        ? ((editingRecord && editingRecord.triggers) || [])
        : (DB.globalTriggers || []);
      if(!triggers.length){
        return `<div class="field"><label>${esc(f.label)}</label><div class="hint">暂无可选触发器</div></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择触发器 —</option>
          ${triggers.map(tr=>`<option value="${esc(tr.trigger)}" ${val===tr.trigger?'selected':''}>${esc(tr.trigger)} → ${esc(TRIGGER_ACTIONS[tr.action]?.name||tr.action)}</option>`).join('')}
        </select></div>`;
    }
    case 'image-file':
      return `<div class="field"><label>${esc(f.label)}</label>
        <button type="button" class="btn" data-tf-image-pick style="width:100%">选择本地图片</button>
        <input type="file" accept="image/*" data-tf-image-input hidden>
        <div class="hint" data-tf-image-preview style="margin-top:6px">${val?'已选择图片':'未选择'}</div>
      </div>`;
    case 'image-select':{
      const atts = (scope === 'record' && editingRecord) ? (editingRecord.attachments||[]) : [];
      if(!atts.length){
        return `<div class="field"><label>${esc(f.label)}</label><div class="hint">当前档案没有图片</div></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择图片 —</option>
          ${atts.map((a,i)=>`<option value="${a.id}" ${val===a.id?'selected':''}>${i+1}. ${esc(a.caption||'（无注释）')}${a.damaged?' [已损坏]':''}</option>`).join('')}
        </select></div>`;
    }
    case 'all-image-select':{
      const options = [];
      curLib().records.forEach(r=>{
        (r.attachments||[]).forEach((a, i)=>{
          options.push({
            value: r.id + '::' + a.id,
            label: (r.title || '未命名') + ' > ' + (a.caption || ('第' + (i+1) + '张')) + (a.damaged ? ' [已损坏]' : '')
          });
        });
      });
      if(!options.length){
        return `<div class="field"><label>${esc(f.label)}</label><div class="hint">当前档案库没有图片</div></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <select class="finput" data-tf="${f.key}">
          <option value="">— 请选择图片 —</option>
          ${options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    case 'file-input':
      return `<div class="field"><label>${esc(f.label)}</label>
        <button type="button" class="btn" data-tf-file-pick style="width:100%">选择本地文件</button>
        <input type="file" data-tf-file-input hidden>
        <div class="hint" data-tf-file-preview style="margin-top:6px">${val?'已选择文件':'未选择'}</div>
      </div>`;
    default:
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="text" class="finput" data-tf="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }
}

function openTriggerForm(scope, existing, onSave){
  const allowedKeys = scope === 'global' ? GLOBAL_ACTION_KEYS : RECORD_ACTION_KEYS;
  const t = existing || {id:uid(), trigger:'', action:allowedKeys[0], p1:'', p2:'', p3:'', p4:'', p5:'', p6:'', p7:'', p8:'', permanent:true, used:false, enabled:true};
  const actionOptions = allowedKeys.map(k=>`<option value="${k}" ${t.action===k?'selected':''}>${TRIGGER_ACTIONS[k].name}</option>`).join('');

  triggerImageTemp = (t.action === 'add-image' || t.action === 'popup-image') ? (t.p1 || '') : '';
  triggerFileTemp = (t.action === 'popup-file' && t.p1) ? { dataUrl: t.p1, name: t.p2 || '文件', type: t.p3 || '' } : null;

  const renderFieldsForAction = (actionKey, currentT) => {
    const def = TRIGGER_ACTIONS[actionKey];
    return (def.fields||[]).map(f=>triggerFieldHTML(f, currentT, scope)).join('');
  };

  $('#modalTitle').textContent = existing ? '编辑触发器' : '新建触发器';
  $('#modalOk').textContent = '保存';
  $('#modalFields').innerHTML = `
    <div class="field"><label>触发词</label>
      <input type="text" class="finput" data-tf="trigger" value="${esc(t.trigger)}" placeholder="如 /reveal">
    </div>
    <div class="field"><label>动作类型（图形化选择）</label>
      <select class="finput" data-tf-action>
        ${actionOptions}
      </select>
    </div>
    <div id="triggerFields">
      ${renderFieldsForAction(t.action, t)}
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" data-tf-perm ${t.permanent?'checked':''}>
        <span>永久（取消勾选则只生效一次）</span>
      </label>
    </div>
  `;

  bindTriggerPickers();

  $('#modalFields [data-tf-action]').addEventListener('change', e=>{
    const newAction = e.target.value;
    triggerImageTemp = '';
    triggerFileTemp = null;
    const currentT = {p1:'', p2:'', p3:'', p4:'', p5:'', p6:'', p7:'', p8:''};
    const def = TRIGGER_ACTIONS[newAction];
    (def.fields||[]).forEach(f=>{
      const el = $('#modalFields [data-tf="'+f.key+'"]');
      if(el){
        if(f.type === 'color'){
          currentT[f.key] = el.value || f.default || '#38f2ff';
        } else if(f.type === 'bool'){
          currentT[f.key] = el.checked ? 'true' : 'false';
        } else if(f.type !== 'image-file' && f.type !== 'file-input'){
          currentT[f.key] = el.value || '';
        }
      }
    });
    $('#triggerFields').innerHTML = renderFieldsForAction(newAction, currentT);
    bindTriggerPickers();
  });

  modalCfg = {
    title: existing ? '编辑触发器' : '新建触发器',
    okText:'保存',
    onSubmit: ()=>{
      const trigger = ($('#modalFields [data-tf="trigger"]')?.value || '').trim();
      if(!trigger){ toast('请输入触发词'); return false; }
      const action = $('#modalFields [data-tf-action]')?.value || allowedKeys[0];
      const def = TRIGGER_ACTIONS[action];
      const vals = {p1:'', p2:'', p3:'', p4:'', p5:'', p6:'', p7:'', p8:''};
      (def.fields||[]).forEach(f=>{
        if(f.type === 'image-file' || f.type === 'file-input') return;
        const el = $('#modalFields [data-tf="'+f.key+'"]');
        if(!el) return;
        if(f.type === 'color'){
          vals[f.key] = el.value || f.default || '#38f2ff';
        } else if(f.type === 'bool'){
          vals[f.key] = el.checked ? 'true' : 'false';
        } else {
          vals[f.key] = el.value || '';
        }
      });
      if(def.fields && def.fields.some(f=>f.type==='image-file')){
        if(triggerImageTemp){
          vals.p1 = triggerImageTemp;
        } else if(t.action === action && t.p1){
          vals.p1 = t.p1;
        }
      }
      if(def.fields && def.fields.some(f=>f.type==='file-input')){
        if(triggerFileTemp){
          vals.p1 = triggerFileTemp.dataUrl;
          if(!vals.p2) vals.p2 = triggerFileTemp.name;
          if(!vals.p3) vals.p3 = triggerFileTemp.type;
        } else if(t.action === action && t.p1){
          vals.p1 = t.p1;
          if(!vals.p2) vals.p2 = t.p2;
          if(!vals.p3) vals.p3 = t.p3;
        }
      }
      const perm = $('#modalFields [data-tf-perm]')?.checked !== false;
      onSave({
        id: t.id, trigger, action,
        p1: vals.p1 || '', p2: vals.p2 || '', p3: vals.p3 || '', p4: vals.p4 || '',
        p5: vals.p5 || '', p6: vals.p6 || '', p7: vals.p7 || '', p8: vals.p8 || '',
        permanent: perm, used: false, enabled: true
      });
    }
  };

  show('#modal');
}

function bindTriggerPickers(){
  $$('#modalFields [data-tf-image-pick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('.field');
      const inp = wrap.querySelector('[data-tf-image-input]');
      if(inp) inp.click();
    });
  });
  $$('#modalFields [data-tf-image-input]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!f) return;
      try{
        const dataUrl = await compressImage(f, 800, 0.65);
        triggerImageTemp = dataUrl;
        const wrap = inp.closest('.field');
        const prev = wrap.querySelector('[data-tf-image-preview]');
        if(prev) prev.textContent = '已选择图片（' + f.name + '）';
      }catch(err){ toast('图片处理失败'); }
    });
  });
  $$('#modalFields [data-tf-file-pick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('.field');
      const inp = wrap.querySelector('[data-tf-file-input]');
      if(inp) inp.click();
    });
  });
  $$('#modalFields [data-tf-file-input]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!f) return;
      try{
        const dataUrl = await readFileDataUrl(f);
        triggerFileTemp = { dataUrl, name: f.name, type: f.type || 'application/octet-stream' };
        const wrap = inp.closest('.field');
        const prev = wrap.querySelector('[data-tf-file-preview]');
        if(prev) prev.textContent = '已选择文件（' + f.name + '）';
      }catch(err){ toast('文件读取失败'); }
    });
  });
}

function saveRecordFromEditor(){
  if(!editingRecord){
    toast('编辑器未初始化');
    return;
  }
  if(!isAdmin()){
    toast('权限不足');
    return;
  }
  const ed = editingRecord;
  const isBackup = !!ed._isBackup;
  const title = (ed.title || '').trim() || '未命名档案';

  const payload = {
    id: ed.id || uid(),
    type: ed.type || 'text',
    title,
    code: ed.code || '',
    description: ed.description || '',
    summary: ed.summary || '',
    content: ed.content || '',
    gradeId: ed.gradeId || '',
    categoryId: ed.categoryId || '',
    tagIds: (ed.tagIds||[]).slice(),
    author: ed.author || '',
    organization: ed.organization || '',
    createdAt: ed.createdAt || Date.now(),
    createdAtText: ed.createdAtText || '',
    updatedAt: Date.now(),
    attachments: (ed.attachments||[]).slice(),
    recordKey: ed.recordKey || '',
    readDelay: (typeof ed.readDelay === 'number') ? ed.readDelay : 1,
    copyableRanges: (ed.copyableRanges||[]).slice(),
    chapters: (ed.chapters||[]).slice(),
    triggers: (ed.triggers||[]).slice(),
    themeColor: ed.themeColor || '',
    notes: ed.notes || '',
    damaged: !!ed.damaged
  };

  if(isBackup){
    if(ed.id){
      const idx = DB.backupRecords.findIndex(r=>r.id === ed.id);
      if(idx >= 0) DB.backupRecords[idx] = payload;
      else DB.backupRecords.unshift(payload);
    } else {
      DB.backupRecords.unshift(payload);
    }
  } else {
    const lib = curLib();
    if(ed.id){
      const idx = lib.records.findIndex(r=>r.id === ed.id);
      if(idx >= 0) lib.records[idx] = payload;
      else lib.records.unshift(payload);
    } else {
      lib.records.unshift(payload);
    }
  }

  const ok = saveDBNow();
  if(!ok){
    toast('保存失败，请检查存储空间或导出备份后清理');
    return;
  }

  try{ localStorage.removeItem(DRAFT); }catch(e){}
  const wasNew = !ed.id;
  editingRecord = null;
  hide('#editor');
  render();
  toast(wasNew ? '已创建' : '已保存');
  playSound('success');
}

function recordToMarkdown(r){
  const g = getGrade(r.gradeId), c = getCategory(r.categoryId);
  const tags = (r.tagIds||[]).map(getTag).filter(Boolean);
  let md = `# ${r.title}\n\n`;
  if(r.code) md += `> 编号：${r.code}\n`;
  md += `> 分级：${g?g.name:'无'}　｜　分类：${c?c.name:'无'}　｜　标签：${tags.length?tags.map(t=>t.name).join('、'):'无'}\n`;
  md += `> 作者：${r.author||'—'}　｜　组织：${r.organization||'—'}\n`;
  md += `> 创建：${r.createdAtText || fmtFull(r.createdAt)}\n\n`;
  if(r.description) md += `## 档案说明\n\n${(r.description||'').replace(/<[^>]+>/g,'')}\n\n`;
  if(r.type === 'text') md += `## 正文\n\n${(r.content||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/div>/gi,'\n').replace(/<[^>]+>/g,'')}\n`;
  if(r.summary) md += `\n## 档案总结\n\n${(r.summary||'').replace(/<[^>]+>/g,'')}\n`;
  if(r.attachments && r.attachments.length){
    md += `\n## 图片\n\n`;
    r.attachments.forEach((a,i)=>{
      md += `### ${i+1}. ${a.caption||'（无注释）'}${a.damaged?' [已损坏]':''}\n\n`;
      if(!a.damaged) md += `![${a.caption||'图片'}](${a.dataUrl})\n\n`;
    });
  }
  return md;
}
function recordToTxt(r){
  const g = getGrade(r.gradeId), c = getCategory(r.categoryId);
  const tags = (r.tagIds||[]).map(getTag).filter(Boolean);
  let t = `${r.title}\n${'='.repeat(50)}\n`;
  if(r.code) t += `编号：${r.code}\n`;
  t += `分级：${g?g.name:'无'}\n分类：${c?c.name:'无'}\n标签：${tags.length?tags.map(x=>x.name).join('、'):'无'}\n`;
  t += `作者：${r.author||'—'}\n组织：${r.organization||'—'}\n`;
  t += `创建：${r.createdAtText || fmtFull(r.createdAt)}\n${'='.repeat(50)}\n\n`;
  if(r.description) t += `【档案说明】\n${(r.description||'').replace(/<[^>]+>/g,'')}\n\n`;
  if(r.type === 'text') t += `【正文】\n${(r.content||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/div>/gi,'\n').replace(/<[^>]+>/g,'')}\n\n`;
  if(r.summary) t += `【档案总结】\n${(r.summary||'').replace(/<[^>]+>/g,'')}\n\n`;
  if(r.attachments && r.attachments.length){
    t += `【图片附录】\n`;
    r.attachments.forEach((a,i)=>{ t += `[${i+1}] ${a.caption||'（无注释）'}${a.damaged?' [已损坏]':''}\n`; });
  }
  return t;
}

function openExportFormatDialog(r){
  if(!isAdmin()){ toast('权限不足：仅管理员可导出'); return; }
  openForm({
    title:'选择导出格式',
    fields:[{key:'fmt', label:'格式', type:'select', options:
      '<option value="md">Markdown (.md)</option><option value="txt">纯文本 (.txt)</option><option value="html">网页 (.html)</option><option value="json">完整存档 (.json)</option>'
    }],
    okText:'导出',
    onSubmit(v){
      const fmt = v.fmt || 'md';
      let text = '', name = safeName(r.title), mime = 'text/plain;charset=utf-8';
      if(fmt === 'md'){ text = recordToMarkdown(r); name += '.md'; mime = 'text/markdown;charset=utf-8'; }
      else if(fmt === 'txt'){ text = recordToTxt(r); name += '.txt'; }
      else if(fmt === 'html'){ text = recordToHTML(r); name += '.html'; mime = 'text/html;charset=utf-8'; }
      else if(fmt === 'json'){ text = recordToJSON(r); name += '-完整存档.json'; mime = 'application/json'; }

      toast(ok ? '已导出' : '导出失败');

function fieldHTML(f){
  if(f.type === 'color'){
    const val = f.value || '#38f2ff';
    return `<div class="field">
      <label>${esc(f.label)}</label>
      <input type="color" class="color-native" data-key="${f.key}" value="${esc(val)}">
    </div>`;
  }
  if(f.type === 'roles'){
    const val = Array.isArray(f.value) ? f.value : [];
    return `<div class="field">
      <label>${esc(f.label)}</label>
      <div class="role-chips" data-key="${f.key}">
        ${allRoles().filter(r=>!r.isAdmin).map(r=>{
          const on = val.indexOf(r.key)>=0;
          return `<button type="button" class="chip ${on?'on':''}" data-role="${r.key}" ${f.locked?'disabled':''}>${esc(r.name)}</button>`;
        }).join('')}
      </div>
    </div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${esc(f.label)}</label>
      <select class="finput" data-key="${f.key}">${f.options||''}</select></div>`;
  }
  if(f.type === 'checkbox'){
    return `<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" data-key="${f.key}" ${f.value?'checked':''}>
      <span>${esc(f.label)}</span></label></div>`;
  }
  const t = f.type === 'password' ? 'password' : 'text';
  return `<div class="field">
    <label>${esc(f.label)}</label>
    <input type="${t}" class="finput" data-key="${f.key}" value="${esc(f.value||'')}"
           placeholder="${esc(f.placeholder||'')}" maxlength="${f.maxlength||60}" autocomplete="off">
  </div>`;
}

function toggleBatch(){
  if(!isAdmin()){ toast('权限不足'); return; }
  state.batchMode = !state.batchMode;
  state.selected.clear();
  render();
}

function batchAction(act){
  if(!isAdmin()){ toast('权限不足'); return; }
  const sel = curLib().records.filter(r=>state.selected.has(r.id));

  if(act === 'exit'){ state.batchMode = false; state.selected.clear(); render(); return; }
  if(act === 'all'){
    const list = filteredRecords();
    if(state.selected.size === list.length) state.selected.clear();
    else list.forEach(r=>state.selected.add(r.id));
    updateRecordList(); updateBatchBar(); return;
  }
  if(act === 'del'){
    if(!sel.length){ toast('未选择档案'); return; }
    if(!confirm('删除选中的 '+sel.length+' 条档案？')) return;
    const ids = new Set(sel.map(r=>r.id));
    curLib().records = curLib().records.filter(r=>!ids.has(r.id));
    state.selected.clear();
    if(saveDBNow()){ render(); toast('已删除 '+ids.size+' 条'); }
    return;
  }
  if(act === 'export'){
    if(!sel.length){ toast('未选择档案'); return; }
    let all = '';
    sel.forEach(r=>{ all += recordToMarkdown(r) + '\n\n<!-- ===== 档案分隔 ===== -->\n\n'; });
    const ok = downloadText('档案合集-'+Date.now()+'.md', all, 'text/markdown;charset=utf-8');
    toast(ok ? '已导出 '+sel.length+' 条档案' : '导出失败');
    return;
  }
  if(act === 'migrate'){
    if(!sel.length){ toast('未选择档案'); return; }
    const options = DB.libraries.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('');
    openForm({
      title:'迁移档案（'+sel.length+' 条）',
      fields:[{key:'lib', label:'目标档案库', type:'select', options}],
      okText:'迁移',
      onSubmit(v){
        const target = DB.libraries.find(l=>l.id === v.lib);
        if(!target) return false;
        const ids = new Set(sel.map(r=>r.id));
        const moving = curLib().records.filter(r=>ids.has(r.id));
        curLib().records = curLib().records.filter(r=>!ids.has(r.id));
        target.records = target.records.concat(moving);
        state.selected.clear();
        if(saveDBNow()){ render(); toast('已迁移到「'+target.name+'」'); playSound('success'); }
      }
    });
    return;
  }
  if(!sel.length){ toast('未选择档案'); return; }

  if(act === 'grade'){
    openForm({
      title:'批量设置分级',
      fields:[{key:'gid', label:'输入分级代号，留空清除', maxlength:8}],
      okText:'应用',
      onSubmit(v){
        const name = (v.gid||'').trim();
        let gid = '';
        if(name){
          const g = curLib().grades.find(x=>x.name === name);
          if(!g){ toast('未找到该分级'); return false; }
          gid = g.id;
        }
        sel.forEach(r=>{ r.gradeId = gid; r.updatedAt = Date.now(); });
        if(saveDBNow()){ render(); toast('已设置'); }
      }
    });
  } else if(act === 'cat'){
    openForm({
      title:'批量设置分类',
      fields:[{key:'cn', label:'输入分类名称，留空清除', maxlength:16}],
      okText:'应用',
      onSubmit(v){
        const name = (v.cn||'').trim();
        let cid = '';
        if(name){
          const c = curLib().categories.find(x=>x.name === name);
          if(!c){ toast('未找到该分类'); return false; }
          cid = c.id;
        }
        sel.forEach(r=>{ r.categoryId = cid; r.updatedAt = Date.now(); });
        if(saveDBNow()){ render(); toast('已设置'); }
      }
    });
  } else if(act === 'tag'){
    openForm({
      title:'批量设置标签',
      fields:[{key:'tags', label:'标签名，用逗号分隔（替换现有）', maxlength:60}],
      okText:'应用',
      onSubmit(v){
        const names = (v.tags||'').split(/[,，、\s]+/).filter(Boolean);
        const ids = [];
        for(const n of names){
          const t = curLib().tags.find(x=>x.name === n);
          if(!t){ toast('未找到标签：' + n); return false; }
          ids.push(t.id);
        }
        sel.forEach(r=>{ r.tagIds = ids.slice(); r.updatedAt = Date.now(); });
        if(saveDBNow()){ render(); toast('已设置'); }
      }
    });
  } else if(act === 'author'){
    openForm({
      title:'批量设置署名',
      fields:[
        {key:'author', label:'作者（留空清除）', maxlength:30},
        {key:'org', label:'组织（留空清除）', maxlength:30}
      ],
      okText:'应用',
      onSubmit(v){
        sel.forEach(r=>{ r.author = (v.author||'').trim(); r.organization = (v.org||'').trim(); r.updatedAt = Date.now(); });
        if(saveDBNow()){ render(); toast('已设置'); }
      }
    });
  } else if(act === 'time'){
    openForm({
      title:'批量修改创建时间（文本）',
      fields:[{key:'time', label:'时间文本（任意）', value: fmtFull(Date.now()), maxlength:40}],
      okText:'应用',
      onSubmit(v){
        const text = (v.time||'').trim();
        sel.forEach(r=>{ r.createdAtText = text; r.updatedAt = Date.now(); });
        if(saveDBNow()){ render(); toast('已修改'); }
      }
    });
  }
}

document.addEventListener('touchstart', e=>{
  if(!isAdmin() || state.batchMode) return;
  const swipe = e.target.closest('.rec-swipe');
  if(!swipe || e.touches.length !== 1) return;
  const card = swipe.querySelector('.rec-card');
  if(!card) return;
  swipeState = {
    swipe, card,
    x0: e.touches[0].clientX,
    y0: e.touches[0].clientY,
    baseX: parseFloat(card.dataset.tx || '0'),
    moved: false
  };
}, {passive: true});

document.addEventListener('touchmove', e=>{
  if(!swipeState) return;
  const dx = e.touches[0].clientX - swipeState.x0;
  const dy = e.touches[0].clientY - swipeState.y0;
  if(!swipeState.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
    swipeState.moved = true;
    swipeState.card.style.transition = 'none';
    swipeState.swipe.classList.add('swiping');
  }
  if(swipeState.moved){
    e.preventDefault();
    let tx = swipeState.baseX + dx;
    tx = Math.max(-140, Math.min(0, tx));
    swipeState.card.style.transform = `translate3d(${tx}px,0,0)`;
    swipeState.card.dataset.tx = tx;
  }
}, {passive: false});

document.addEventListener('touchend', ()=>{
  if(!swipeState) return;
  const s = swipeState;
  swipeState = null;
  if(!s.moved) return;
  s.swipe.classList.remove('swiping');
  const tx = parseFloat(s.card.dataset.tx || '0');
  const final = tx < -70 ? -140 : 0;
  s.card.style.transition = 'transform .2s';
  s.card.style.transform = `translate3d(${final}px,0,0)`;
  s.card.dataset.tx = final;
  if(final !== 0) s.swipe.classList.add('open');
  else s.swipe.classList.remove('open');
  setTimeout(()=>{ s.card.style.transition = ''; }, 250);
});

    playSound('click');

  }

  const ra = e.target.closest('.ra-btn');
  if(ra){
    const id = ra.dataset.id;
    const swipe = ra.closest('.rec-swipe');
    const card = swipe.querySelector('.rec-card');
    card.style.transition = 'transform .2s';
    card.style.transform = 'translate3d(0,0,0)';
    card.dataset.tx = '0';
    swipe.classList.remove('open');
    if(ra.dataset.ra === 'edit'){
      const r = curLib().records.find(x=>x.id === id);
      if(r) openEditor(r);
    } else if(ra.dataset.ra === 'del'){
      if(!confirm('删除该档案？')) return;
      curLib().records = curLib().records.filter(r=>r.id !== id);
      if(saveDBNow()){ render(); toast('已删除'); }
    }
    return;
  }

  const quick = e.target.closest('[data-quick]');
  if(quick){
    if(!isAdmin()){ toast('权限不足'); return; }
    if(quick.dataset.quick === 'new'){
      openForm({
        title:'新建档案 · 选择类型',
        fields:[{key:'type', label:'类型', type:'select', options:
          '<option value="text">文本档案</option><option value="image">图片档案</option>'}],
        okText:'创建',
        onSubmit(v){ openEditor(null, {type:v.type}); }
      });
    } else if(quick.dataset.quick === 'import') openBatchImport();
    return;
  }

  const bb = e.target.closest('[data-batch]');
  if(bb){ batchAction(bb.dataset.batch); return; }

  const sb = e.target.closest('[data-sel]');
  if(sb){
    if(!isAdmin()) return;
    const id = sb.dataset.sel;
    if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
    updateRecordList(); updateBatchBar();
    return;
  }

  const card = e.target.closest('.rec-card');
  if(card && !card.closest('#kaResult') && !card.closest('.email-item')){
    const id = card.dataset.id;
    if(parseFloat(card.dataset.tx || '0') !== 0){
      card.style.transition = 'transform .2s';
      card.style.transform = 'translate3d(0,0,0)';
      card.dataset.tx = '0';
      card.closest('.rec-swipe')?.classList.remove('open');
      return;
    }
    if(state.batchMode){
      if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      updateRecordList(); updateBatchBar();
      return;
    }
    const r = curLib().records.find(x=>x.id === id);
    if(!r) return;
    if(r.damaged){ toast('该档案已损坏'); return; }
    if(!canViewRecord(r)){
      if(!r.recordKey){ toast('权限不足，且该档案无密钥'); return; }
      openForm({
        title:'⚠ 权限不足',
        fields:[{key:'key', label:'输入档案密钥可直接查看', type:'password', maxlength:80}],
        okText:'验证',
        onSubmit(v){
          if(v.key === r.recordKey){
            setTimeout(()=>openRecord(r, true), 200);
            return true;
          }
          toast('密钥错误'); playSound('error');
          return false;
        }
      });
      return;
    }
    openRecord(r);
    return;
  }

  if(e.target.closest('#filterClose')){ closeFilterPanel(); return; }
  if(e.target.closest('#filterClear')){
    state.filterTagId=''; state.filterCatId=''; state.filterYear='';
    state.filterGradeId=''; state.filterChapter='';
    const st = $('#main').scrollTop;
    openFilterPanel(); renderRecords();
    requestAnimationFrame(()=>{ $('#main').scrollTop = st; });
    return;
  }
  const fch = e.target.closest('[data-fch]');
  if(fch){ state.filterChapter = fch.dataset.fch; keepScrollAndRenderFilter(); return; }
  const fy = e.target.closest('[data-fy]');
  if(fy){ state.filterYear = fy.dataset.fy; keepScrollAndRenderFilter(); return; }
  const fg = e.target.closest('[data-fg]');
  if(fg){ state.filterGradeId = fg.dataset.fg; keepScrollAndRenderFilter(); return; }
  const ft = e.target.closest('[data-ft]');
  if(ft){ state.filterTagId = ft.dataset.ft; state.filterCatId=''; keepScrollAndRenderFilter(); return; }
  const fc = e.target.closest('[data-fc]');
  if(fc){ state.filterCatId = fc.dataset.fc; keepScrollAndRenderFilter(); return; }
  if(e.target.closest('[data-act="openFilter"]')){ openFilterPanel(); return; }
  if(e.target.closest('[data-act="clearFilter"]')){
    state.filterTagId=''; state.filterCatId=''; state.filterYear='';
    state.filterGradeId=''; state.filterChapter='';
    renderRecords(); return;
  }
  if(e.target.closest('[data-act="toggleBatch"]')){ toggleBatch(); return; }

  const pact = e.target.closest('[data-pact]');
  if(pact){
    const a = pact.dataset.pact;
    if(a === 'switchRole') switchRoleDialog();
    else if(a === 'changeSelfKey') changeSelfKey();
    else if(a === 'editRoleKey') editRoleKey(pact.dataset.role);
    else if(a === 'addCustomRole') addCustomRole();
    else if(a === 'delCustomRole') delCustomRole(pact.dataset.role);
    else if(a === 'changeName') changeName();
    return;
  }
  const gact = e.target.closest('[data-gact]');
  if(gact){
    const a = gact.dataset.gact;
    if(a === 'add') addGrade();
    else if(a === 'edit') editGrade(gact.dataset.id);
    else if(a === 'del') delGrade(gact.dataset.id);
    return;
  }
  const cact = e.target.closest('[data-cact]');
  if(cact){
    const a = cact.dataset.cact;
    if(a === 'add') addCat();
    else if(a === 'edit') editCat(cact.dataset.id);
    else if(a === 'del') delCat(cact.dataset.id);
    return;
  }
  const tact = e.target.closest('[data-tact]');
  if(tact){
    const a = tact.dataset.tact;
    if(a === 'add') addTag();
    else if(a === 'edit') editTag(tact.dataset.id);
    else if(a === 'del') delTag(tact.dataset.id);
    return;
  }
  const lact = e.target.closest('[data-lact]');
  if(lact){
    const a = lact.dataset.lact;
    if(a === 'add') libraryAdd();
    else if(a === 'edit') libraryEdit(lact.dataset.id);
    else if(a === 'del') libraryDel(lact.dataset.id);
    else if(a === 'use'){ DB.currentLibraryId = lact.dataset.id; saveDB(); render(); toast('已切换'); }
    else if(a === 'switch') librarySwitchByKey();
    return;
  }
  const bact = e.target.closest('[data-bact]');
  if(bact){
    const a = bact.dataset.bact;
    if(a === 'add') openBackupForm();
    else if(a === 'edit'){
      const b = DB.backupRecords.find(x=>x.id === bact.dataset.id);
      if(b) backupRecordEditor(b);
    } else if(a === 'del'){
      if(!confirm('删除该备用档案？')) return;
      DB.backupRecords = DB.backupRecords.filter(x=>x.id !== bact.dataset.id);
      saveDB(); render(); toast('已删除');
    }
    return;
  }
  const tract = e.target.closest('[data-tract]');
  if(tract){
    if(!isAdmin()){ toast('权限不足'); return; }
    const a = tract.dataset.tract;
    if(a === 'add') openTriggerForm('global', null, t=>{ DB.globalTriggers.push(t); saveDB(); render(); toast('已添加'); });
    else if(a === 'edit'){
      const t = DB.globalTriggers.find(x=>x.id === tract.dataset.id);
      if(t) openTriggerForm('global', t, nt=>{ Object.assign(t, nt); saveDB(); render(); toast('已更新'); });
    } else if(a === 'del'){
      if(!confirm('删除？')) return;
      DB.globalTriggers = DB.globalTriggers.filter(x=>x.id !== tract.dataset.id);
      saveDB(); render(); toast('已删除');
    }
    return;
  }
  const dact = e.target.closest('[data-dact]');
  if(dact){
    const a = dact.dataset.dact;
    if(a === 'export'){ if(!isAdmin()){ toast('权限不足'); return; } exportBackup(); }
    else if(a === 'import'){ $('#backupFile').click(); }
    else if(a === 'clear'){ clearAll(); }
    return;
  }

  const lb = e.target.closest('[data-lb-index]');
  if(lb){
    const recordId = lb.dataset.lbRecord;
    const idx = parseInt(lb.dataset.lbIndex, 10);
    if(recordId){
      openLightbox(recordId, idx);
    } else if(editingRecord && editingRecord.attachments && editingRecord.attachments[idx]){
      const a = editingRecord.attachments[idx];
      if(a.damaged){ toast('图片已损坏'); return; }
      $('#lbImg').src = a.dataUrl;
      $('#lbCap').textContent = a.caption || '（无注释）';

      lightboxIndex = -1;
      show('#imageLightbox');

  if(e.target.closest('#lbClose')){
    hide('#imageLightbox');
    return;
  }
  if(e.target.closest('#imageLightbox') && !e.target.closest('.lb-img')){
    hide('#imageLightbox');
    return;
  }

  if(e.target.closest('#warnOk')){ hide('#warningModal'); return; }

  const kaOpen = e.target.closest('[data-ka-open]');
  if(kaOpen){
    const id = kaOpen.dataset.kaOpen;
    const libId = kaOpen.dataset.kaLib;
    const lib = DB.libraries.find(l=>l.id === libId) || curLib();
    const r = lib.records.find(x=>x.id === id);
    if(!r){ toast('档案不存在'); return; }
    if(r.damaged){ toast('该档案已损坏'); return; }
    if(lib.id !== curLib().id){
      if(!isAdmin()){ toast('该档案在其他档案库中'); return; }
      DB.currentLibraryId = lib.id;
      saveDB();
    }
    hide('#keyAccess');
    state.nav = 'records';
    $$('#sidebarNav [data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav === 'records'));
    render();
    setTimeout(()=>openRecord(r, true), 200);
    return;
  }

  const kh = e.target.closest('[data-kh-record]');
  if(kh){
    const recordId = kh.dataset.khRecord;
    const libId = kh.dataset.khLib;
    const lib = DB.libraries.find(l=>l.id === libId) || curLib();
    const r = lib.records.find(x=>x.id === recordId);
    if(!r){ toast('档案已被删除'); return; }
    if(r.damaged){ toast('该档案已损坏'); return; }
    if(lib.id !== curLib().id){
      if(!isAdmin()){ toast('该档案在其他档案库中'); return; }
      DB.currentLibraryId = lib.id;
      saveDB();
    }
    hide('#keyAccess');
    state.nav = 'records';
    $$('#sidebarNav [data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav === 'records'));
    render();
    setTimeout(()=>openRecord(r, true), 200);
    return;
  }

  if(e.target.closest('#viewerClose')){ closeViewer(); return; }
  if(e.target.closest('#viewerEdit')){
    if(!isAdmin()){ toast('权限不足'); return; }
    if(!currentRecord) return;
    const r = currentRecord;
    hide('#viewer'); currentRecord = null;
    openEditor(r);
    return;
  }

  if(e.target.closest('#homeEnter')){
    hide('#homePage');
    playSound('success');
    return;
  }
  if(e.target.closest('#homeDev')){ openDevKeyDialog(); return; }
  if(e.target.closest('#devClose')){ hide('#devPanel'); return; }

  if(e.target.closest('#poCancel')) return;
});

$('#edBack').onclick = ()=>{
  if(editingRecord && !editingRecord.id && (editingRecord.title || editingRecord.content || (editingRecord.attachments && editingRecord.attachments.length))){
    if(!confirm('尚未保存为正式档案。草稿已自动保存，确定返回？')) return;
  }
  saveDraftNow();
  hide('#editor');
  editingRecord = null;
};

$('#edSave').onclick = saveRecordFromEditor;

function renderAppearance(){
  const acc = $('#globalAccent');
  if(acc){
    acc.value = DB.settings.accent;
    acc.oninput = ()=>{
      DB.settings.accent = acc.value;
      applyTheme(); renderTop(); saveDB();
    };
  }
  const td = $('#terminalDelay');
  const sd = $('#searchDelay');
  if(td){
    td.value = DB.settings.terminalLoadDelay;
    td.oninput = ()=>{ DB.settings.terminalLoadDelay = Math.max(0, Math.min(5000, parseInt(td.value,10)||0)); saveDB(); };
  }
  if(sd){
    sd.value = DB.settings.searchLoadDelay;
    sd.oninput = ()=>{ DB.settings.searchLoadDelay = Math.max(0, Math.min(5000, parseInt(sd.value,10)||0)); saveDB(); };
  }
}

$('#kaBack').onclick = ()=>hide('#keyAccess');
$('#kaClear').onclick = resetKeyHistory;

function exportBackup(){
  if(!isAdmin()){ toast('权限不足'); return; }
  try{
    const ok = downloadText('archive-full-backup-'+Date.now()+'.json', JSON.stringify(DB, null, 2), 'application/json');
    toast(ok ? '完整备份已导出' : '导出失败');
  }catch(e){ toast('导出失败'); }
}

$('#backupFile').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    const txt = await readFileText(f);
    const d = JSON.parse(txt);
    if(!d || typeof d !== 'object') throw new Error('bad');

    if(d.__type === 'archive_single_record' && d.record){
      const rec = migrateRecord(d.record);
      curLib().records.unshift(rec);
      saveDBNow(); render(); toast('单档案已导入');
      return;
    }

    if(Array.isArray(d.libraries) || Array.isArray(d.records)){
      if(!confirm('检测到完整数据备份，导入将覆盖当前所有数据（权限密钥保留）。继续？')) return;
      const curRole = DB.currentRole;
      const keys = DB.roleKeys;
      const migrated = migrateDB(d);
      migrated.currentRole = curRole;
      migrated.roleKeys = keys;
      DB = migrated;
      stabilityLive = DB.stability || 85;
      applyTheme();
      saveDBNow();
      state.selected.clear();
      state.batchMode = false;
      state.settingsPage = 'main';
      render(); toast('完整备份已导入');
      return;
    }

    toast('无法识别的文件格式');
  }catch(err){
    console.warn(err);
    toast('导入失败：文件格式错误');
  }
});

function clearAll(){
  if(!isAdmin()){ toast('权限不足'); return; }
  if(!confirm('确定清空全部数据？')) return;
  if(!confirm('再次确认：此操作不可撤销')) return;
  const curRole = DB.currentRole;
  const keys = DB.roleKeys;
  DB = blankDB();
  DB.currentRole = curRole;
  DB.roleKeys = keys;
  stabilityLive = DB.stability;
  state.selected.clear();
  state.batchMode = false;
  try{ localStorage.removeItem(DRAFT); }catch(e){}
  applyTheme();
  saveDBNow();
  render();
  toast('已清空');
}

function sendSystemNotification(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted'){
    try{ new Notification(title, { body, tag: 'archive-terminal' }); }catch(e){}
  } else if(Notification.permission === 'default'){
    Notification.requestPermission().then(perm=>{
      if(perm === 'granted'){
        try{ new Notification(title, { body, tag: 'archive-terminal' }); }catch(e){}
      }
    });
  }
}

function tickStability(){
  if(DB.stabilityRecovery && DB.stabilityRecovery.active){
    if(stabilityLive < 80){
      stabilityLive = Math.min(80, stabilityLive + 1);
      if(stabilityLive >= 80) DB.stabilityRecovery.active = false;
    } else {
      DB.stabilityRecovery.active = false;
    }
  } else {
    const delta = (Math.random() - 0.5) * 0.6;
    stabilityLive = Math.max(0, Math.min(100, stabilityLive + delta));
  }

  const stab = $('#stabilityInd');
  const sVal = Math.round(stabilityLive);
  const newClass = 'stability-ind' + (sVal <= 50 ? ' critical' : sVal <= 70 ? ' warn' : '');
  if(stab){
    const txt = sVal + '%';
    if(stab.textContent !== txt) stab.textContent = txt;
    if(stab.className !== newClass) stab.className = newClass;
  }

  let stateChanged = false;
  if(stabilityLive <= 0 && DB.status !== 'offline'){
    DB.status = 'offline';
    stateChanged = true;
    toast('未连接到终端');
    playSound('error');
  } else if(stabilityLive <= 50 && stabilityLive > 0 && DB.status === 'online'){
    DB.status = 'standby';
    stateChanged = true;
    toast('终端连接不稳定，自动进入待机');
    playSound('error');
  }

  stabilityTickCount++;
  if(stateChanged || stabilityTickCount >= 10){
    stabilityTickCount = 0;
    DB.stability = stabilityLive;
    saveDB();
    if(stateChanged) renderTop();
  }
}

function tickMails(){
  const now = Date.now();
  let changed = false;
  (DB.mails||[]).forEach(m=>{
    if(m.pendingReply && m.pendingReply.due <= now){
      const text = m.pendingReply.text;
      m.replies.push({ text, time: now });
      m.pendingReply = null;
      maybeScheduleMailAutoReply(m, text);
      m.read = false;
      changed = true;
      sendSystemNotification('邮件回复已送达', m.title);
      playSound('notify');
    }
    if(Array.isArray(m.autoReplies)){
      for(let i=m.autoReplies.length-1;i>=0;i--){
        const rule = m.autoReplies[i];
        if(rule && rule.due && rule.due <= now){
          m.replies.push({ text: rule.text || '', time: now });
          m.autoReplies.splice(i, 1);
          m.read = false;
          changed = true;
          sendSystemNotification('邮件回复已送达', m.title);
          playSound('notify');
        }
      }
    }
  });
  if(changed){
    saveDB();
    renderTop();
    if(state.nav === 'mailbox') render();
  }
}

window.addEventListener('beforeunload', ()=>{ saveDraftNow(); saveDBNow(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ saveDraftNow(); saveDBNow(); } });

applyTheme();
render();
show('#homePage');

stabilityLive = DB.stability || 85;

setInterval(tickStability, 1000);
setInterval(tickMails, 3000);

if('Notification' in window && Notification.permission === 'default'){
  setTimeout(()=>{ try{ Notification.requestPermission(); }catch(e){} }, 2000);
}
</script>
